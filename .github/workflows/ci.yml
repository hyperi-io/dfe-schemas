# Minimal CI for dfe-schemas: validate every schema YAML against the
# dfe-engine meta-schema.
#
# No semantic-release: this repo is versioned by a git tag cut in lockstep
# with the dfe-infra stack release and recorded in that repo's versions.yaml.
#
# The meta-schema and loader live in dfe-engine, so it is checked out and
# uv-synced the way its own Dockerfile builds it. It is private, so the
# checkout uses a token minted from the org CI GitHub App.
#
# The drift check uses `git status --porcelain`, not `git diff`: a render can
# add or remove a file as well as change one, and git diff is blind to an
# untracked addition.
#
# argocd/ddl/dfe_hunts.detection.sql is hand-maintained and therefore not
# covered - see dfe-engine#127.
#
# Action refs should be SHA-pinned per HyperI CI policy before this is
# promoted; Renovate's helpers:pinGitHubActionDigests raises that PR.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ${{ vars.GH_RUNNER_DEFAULT || 'ubuntu-latest' }}
    steps:
      - name: Checkout dfe-schemas
        uses: actions/checkout@v7

      - name: Mint a read token for dfe-engine
        id: engine-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: dfe-engine
          permission-contents: read

      - name: Checkout dfe-engine (schema loader)
        uses: actions/checkout@v7
        with:
          repository: hyperi-io/dfe-engine
          ref: main
          token: ${{ steps.engine-token.outputs.token }}
          path: .dfe-engine

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dfe-engine
        working-directory: .dfe-engine
        run: uv sync --frozen --no-dev

      - name: Validate schemas
        run: .dfe-engine/.venv/bin/python scripts/validate_schemas.py

      - name: Render DDL and check for drift
        run: |
          .dfe-engine/.venv/bin/python scripts/render_ddl.py
          if [ -n "$(git status --porcelain argocd/ddl/)" ]; then
            echo "argocd/ddl/ does not match a fresh render -- run 'make render' and commit"
            git status --short argocd/ddl/
            git diff -- argocd/ddl/
            exit 1
          fi
