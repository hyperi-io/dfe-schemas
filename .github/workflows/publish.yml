# Publish the dfe-schemas package to PyPI.
#
# Dispatch-gated on purpose: this repo is versioned by hand (pyproject
# version) in lockstep with the stack, not by semantic-release, so a human
# bumps the version and runs this. The token is the org PYPI_TOKEN secret
# (selected-repository visibility includes dfe-schemas), the same mechanism
# hyperi-ci's publish stage uses.

name: Publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ${{ vars.GH_RUNNER_DEFAULT || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Test
        run: uv run --group dev pytest tests -q

      - name: Build
        run: uv build

      - name: Refuse to overwrite a published version
        run: |
          VERSION=$(uv run python -c "import dfe_schemas, importlib.metadata; print(importlib.metadata.version('dfe-schemas'))")
          if curl -fsS "https://pypi.org/pypi/dfe-schemas/$VERSION/json" > /dev/null 2>&1; then
            echo "::error::dfe-schemas $VERSION is already on PyPI - bump pyproject first"
            exit 1
          fi

      - name: Publish
        run: uv publish --token "$PYPI_TOKEN"
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
