#
# `validate` borrows dfe-engine's loader, so it runs here rather than in the hyperi-ci caller.

name: Validate schemas

"on":
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dfe-schemas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install this package
        run: uv sync

      - name: Render every object for every platform
        run: uv run python scripts/render_manifest.py

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dfe-schemas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mint a read token for dfe-engine
        id: engine-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: dfe-engine
          permission-contents: read

      - name: Checkout dfe-engine (schema loader)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hyperi-io/dfe-engine
          ref: main
          token: ${{ steps.engine-token.outputs.token }}
          path: .dfe-engine

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dfe-engine
        working-directory: .dfe-engine
        run: uv sync --frozen --no-dev

      - name: Validate schemas
        run: .dfe-engine/.venv/bin/python scripts/validate_schemas.py
