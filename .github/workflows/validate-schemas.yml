# Project:   dfe-schemas
# File:      .github/workflows/validate-schemas.yml
# Purpose:   Render the apply manifest, and validate the meta schemas
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# Two jobs, and the split is the point.
#
# `render` needs NOTHING but this package: it loads the apply manifest and
# renders every object for every ClickHouse platform, so the source of truth checks its
# own content. That is the half that matters most now that a table is defined
# here and nowhere else.
#
# `validate` still borrows dfe-engine's loader for the meta-schema models,
# which is why it checks out a private repo. Kept OUT of ci.yml (the hyperi-ci
# caller) because hyperi-ci has no stage for a cross-repo checkout, and folding
# it into this repo's pytest suite would put dfe-engine in dfe-schemas'
# dependency graph -- a cycle, since dfe-engine depends on the dfe-schemas
# wheel.
#
# The dfe-engine venv installs dfe-schemas from PyPI as a dependency; what gets
# validated is still THIS checkout, because validate_schemas.py passes explicit
# paths and points DFE_SCHEMAS_DIR at the repo root.

name: Validate schemas

"on":
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ${{ vars.GH_RUNNER_DEFAULT || 'ubuntu-latest' }}
    steps:
      - name: Checkout dfe-schemas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install this package
        run: uv sync

      - name: Render every object for every platform
        run: uv run python scripts/render_manifest.py

  validate:
    runs-on: ${{ vars.GH_RUNNER_DEFAULT || 'ubuntu-latest' }}
    steps:
      - name: Checkout dfe-schemas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mint a read token for dfe-engine
        id: engine-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: dfe-engine
          permission-contents: read

      - name: Checkout dfe-engine (schema loader)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hyperi-io/dfe-engine
          ref: main
          token: ${{ steps.engine-token.outputs.token }}
          path: .dfe-engine

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install dfe-engine
        working-directory: .dfe-engine
        run: uv sync --frozen --no-dev

      - name: Validate schemas
        run: .dfe-engine/.venv/bin/python scripts/validate_schemas.py
