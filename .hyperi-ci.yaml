license: BUSL-1.1

classification: product

test:
  python:
    parallel: auto
    # Coverage measures the shipped package alone: hyperi-ci would also add scripts/, which is maintainer tooling the wheel does not carry.
    args:
      - "-v"
      - "--tb=short"
      - "--cov=dfe_schemas"

release:
  enabled: true
  # Wheel and sdist to PyPI only.
