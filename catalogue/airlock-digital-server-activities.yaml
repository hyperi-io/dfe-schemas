# Catalogue source airlock-digital-server-activities: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: airlock-digital-server-activities
display_name: airlock_digital.server_activities
description: The server_activities data stream of the Elastic airlock_digital integration.
match:
  field: data_stream.dataset
  operator: equals
  value: airlock_digital.server_activities
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/airlock_digital/server_activities
  additional_fields: additional/airlock_digital/server_activities
transform:
  engine: elastic
  variant: filebeat.airlock_digital_server_activities.default
catalogue:
  package: airlock_digital
  data_stream: server_activities
  intakes: [beats]
  variants:
    - filebeat.airlock_digital_server_activities.default
