# Catalogue source apache-access: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: apache-access
display_name: apache.access
description: The access data stream of the Elastic apache integration.
match:
  field: data_stream.dataset
  operator: equals
  value: apache.access
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/apache/access
  additional_fields: additional/apache/access
transform:
  engine: elastic
  variant: filebeat.apache_access.default
catalogue:
  package: apache
  data_stream: access
  intakes: [beats]
  variants:
    - filebeat.apache_access.default
