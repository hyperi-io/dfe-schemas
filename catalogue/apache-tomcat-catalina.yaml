# Catalogue source apache-tomcat-catalina: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: apache-tomcat-catalina
display_name: apache_tomcat.catalina
description: The catalina data stream of the Elastic apache_tomcat integration.
match:
  field: data_stream.dataset
  operator: equals
  value: apache_tomcat.catalina
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/apache_tomcat/catalina
  additional_fields: additional/apache_tomcat/catalina
transform:
  engine: elastic
  variant: filebeat.apache_tomcat_catalina.default
catalogue:
  package: apache_tomcat
  data_stream: catalina
  intakes: [beats]
  variants:
    - filebeat.apache_tomcat_catalina.default
