# Catalogue source apache-tomcat-session: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: apache-tomcat-session
display_name: apache_tomcat.session
description: The session data stream of the Elastic apache_tomcat integration.
match:
  field: data_stream.dataset
  operator: equals
  value: apache_tomcat.session
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/apache_tomcat/session
  additional_fields: additional/apache_tomcat/session
transform:
  engine: elastic
  variant: filebeat.apache_tomcat_session.default
catalogue:
  package: apache_tomcat
  data_stream: session
  intakes: [beats]
  variants:
    - filebeat.apache_tomcat_session.default
