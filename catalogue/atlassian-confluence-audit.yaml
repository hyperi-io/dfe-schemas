# Catalogue source atlassian-confluence-audit: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: atlassian-confluence-audit
display_name: atlassian_confluence.audit
description: The audit data stream of the Elastic atlassian_confluence integration.
match:
  field: data_stream.dataset
  operator: equals
  value: atlassian_confluence.audit
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/atlassian_confluence/audit
  additional_fields: additional/atlassian_confluence/audit
transform:
  engine: elastic
  variant: filebeat.atlassian_confluence_audit.default
catalogue:
  package: atlassian_confluence
  data_stream: audit
  intakes: [beats]
  variants:
    - filebeat.atlassian_confluence_audit.default
