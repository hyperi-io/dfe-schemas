# Catalogue source aws-elb-logs: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: aws-elb-logs
display_name: aws.elb_logs
description: The elb_logs data stream of the Elastic aws integration.
fetcher:
  source_type: aws
  topic: own
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/aws/elb_logs
  additional_fields: additional/aws/elb_logs
transform:
  engine: elastic
  variant: filebeat.aws_elb_logs.default
catalogue:
  package: aws
  data_stream: elb_logs
  intakes: [beats, fetcher]
  variants:
    - filebeat.aws_elb_logs.default
