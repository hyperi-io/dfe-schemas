# Catalogue source aws-firewall-logs: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: aws-firewall-logs
display_name: aws.firewall_logs
description: The firewall_logs data stream of the Elastic aws integration.
fetcher:
  source_type: aws
  topic: own
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/aws/firewall_logs
  additional_fields: additional/aws/firewall_logs
transform:
  engine: elastic
  variant: filebeat.aws_firewall_logs.default
catalogue:
  package: aws
  data_stream: firewall_logs
  intakes: [beats, fetcher]
  variants:
    - filebeat.aws_firewall_logs.default
