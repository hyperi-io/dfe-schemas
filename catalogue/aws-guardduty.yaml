# Catalogue source aws-guardduty: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: aws-guardduty
display_name: aws.guardduty
description: The guardduty data stream of the Elastic aws integration.
fetcher:
  source_type: aws
  topic: own
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/aws/guardduty
  additional_fields: additional/aws/guardduty
transform:
  engine: elastic
  variant: filebeat.aws_guardduty.default
catalogue:
  package: aws
  data_stream: guardduty
  intakes: [beats, fetcher]
  variants:
    - filebeat.aws_guardduty.default
