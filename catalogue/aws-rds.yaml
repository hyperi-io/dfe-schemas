# Catalogue source aws-rds: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: aws-rds
display_name: aws.rds
description: The rds data stream of the Elastic aws integration.
fetcher:
  source_type: aws
  topic: own
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/aws/rds
  additional_fields: additional/aws/rds
transform:
  engine: elastic
  variant: filebeat.aws_rds.default
catalogue:
  package: aws
  data_stream: rds
  intakes: [beats, fetcher]
  variants:
    - filebeat.aws_rds.default
