# Catalogue source aws-apigateway-logs: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: aws-apigateway-logs
display_name: aws.apigateway_logs
description: The apigateway_logs data stream of the Elastic aws integration.
fetcher:
  source_type: aws
  topic: own
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/aws/apigateway_logs
  additional_fields: additional/aws/apigateway_logs
transform:
  engine: elastic
  variant: filebeat.aws_apigateway_logs.default
catalogue:
  package: aws
  data_stream: apigateway_logs
  intakes: [beats, fetcher]
  variants:
    - filebeat.aws_apigateway_logs.default
