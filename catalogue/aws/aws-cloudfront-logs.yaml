# Catalogue source aws-cloudfront-logs: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: aws-cloudfront-logs
display_name: aws.cloudfront_logs
description: The cloudfront_logs data stream of the Elastic aws integration.
match:
  field: data_stream.dataset
  operator: equals
  value: aws.cloudfront_logs
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/aws/cloudfront_logs
  additional_fields: additional/aws/cloudfront_logs
transform:
  engine: elastic
  variant: filebeat.aws_cloudfront_logs.default
catalogue:
  package: aws
  data_stream: cloudfront_logs
  intakes: [beats]
  variants:
    - filebeat.aws_cloudfront_logs.default
