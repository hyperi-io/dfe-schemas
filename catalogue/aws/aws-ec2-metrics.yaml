# Catalogue source aws-ec2-metrics: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: aws-ec2-metrics
display_name: aws.ec2_metrics
description: The ec2_metrics data stream of the Elastic aws integration.
fetcher:
  source_type: aws
  topic: own
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/aws/ec2_metrics
  additional_fields: additional/aws/ec2_metrics
transform:
  engine: elastic
  variant: filebeat.aws_ec2_metrics.default
catalogue:
  package: aws
  data_stream: ec2_metrics
  intakes: [beats, fetcher]
  variants:
    - filebeat.aws_ec2_metrics.default
