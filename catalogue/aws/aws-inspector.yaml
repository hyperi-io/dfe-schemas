# Catalogue source aws-inspector: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: aws-inspector
display_name: aws.inspector
description: The inspector data stream of the Elastic aws integration.
fetcher:
  source_type: aws
  topic: own
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/aws/inspector
  additional_fields: additional/aws/inspector
transform:
  engine: elastic
  variant: filebeat.aws_inspector.default
catalogue:
  package: aws
  data_stream: inspector
  intakes: [beats, fetcher]
  variants:
    - filebeat.aws_inspector.default
