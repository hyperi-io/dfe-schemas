# Catalogue source aws-natgateway: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: aws-natgateway
display_name: aws.natgateway
description: The natgateway data stream of the Elastic aws integration.
match:
  field: data_stream.dataset
  operator: equals
  value: aws.natgateway
transform:
  engine: elastic
  variant: filebeat.aws_natgateway.default
catalogue:
  package: aws
  data_stream: natgateway
  intakes: [beats]
  variants:
    - filebeat.aws_natgateway.default
