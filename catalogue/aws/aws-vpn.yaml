# Catalogue source aws-vpn: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: aws-vpn
display_name: aws.vpn
description: The vpn data stream of the Elastic aws integration.
match:
  field: data_stream.dataset
  operator: equals
  value: aws.vpn
transform:
  engine: elastic
  variant: filebeat.aws_vpn.default
catalogue:
  package: aws
  data_stream: vpn
  intakes: [beats]
  variants:
    - filebeat.aws_vpn.default
