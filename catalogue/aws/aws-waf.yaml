# Catalogue source aws-waf: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: aws-waf
display_name: aws.waf
description: The waf data stream of the Elastic aws integration.
fetcher:
  source_type: aws
  topic: own
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/aws/waf
  additional_fields: additional/aws/waf
transform:
  engine: elastic
  variant: filebeat.aws_waf.default
catalogue:
  package: aws
  data_stream: waf
  intakes: [beats, fetcher]
  variants:
    - filebeat.aws_waf.default
