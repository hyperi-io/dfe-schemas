# Catalogue source azure-openai-logs: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: azure-openai-logs
display_name: azure_openai.logs
description: The logs data stream of the Elastic azure_openai integration.
match:
  field: data_stream.dataset
  operator: equals
  value: azure_openai.logs
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/azure_openai/logs
  additional_fields: additional/azure_openai/logs
transform:
  engine: elastic
  variant: filebeat.azure_openai_logs.default
catalogue:
  package: azure_openai
  data_stream: logs
  intakes: [beats]
  variants:
    - filebeat.azure_openai_logs.default
