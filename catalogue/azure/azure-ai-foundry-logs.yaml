# Catalogue source azure-ai-foundry-logs: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: azure-ai-foundry-logs
display_name: azure_ai_foundry.logs
description: The logs data stream of the Elastic azure_ai_foundry integration.
match:
  field: data_stream.dataset
  operator: equals
  value: azure_ai_foundry.logs
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/azure_ai_foundry/logs
  additional_fields: additional/azure_ai_foundry/logs
transform:
  engine: elastic
  variant: filebeat.azure_ai_foundry_logs.default
catalogue:
  package: azure_ai_foundry
  data_stream: logs
  intakes: [beats]
  variants:
    - filebeat.azure_ai_foundry_logs.default
