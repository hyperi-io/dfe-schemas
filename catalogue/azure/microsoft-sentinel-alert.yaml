# Catalogue source microsoft-sentinel-alert: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: microsoft-sentinel-alert
display_name: microsoft_sentinel.alert
description: The alert data stream of the Elastic microsoft_sentinel integration.
match:
  field: data_stream.dataset
  operator: equals
  value: microsoft_sentinel.alert
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/microsoft_sentinel/alert
  additional_fields: additional/microsoft_sentinel/alert
transform:
  engine: elastic
  variant: filebeat.microsoft_sentinel_alert.default
catalogue:
  package: microsoft_sentinel
  data_stream: alert
  intakes: [beats]
  variants:
    - filebeat.microsoft_sentinel_alert.default
