# Catalogue source bluecoat-director: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: bluecoat-director
display_name: bluecoat.director
description: The director data stream of the Elastic bluecoat integration.
match:
  field: _source
  operator: equals
  value: bluecoat-director
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/bluecoat/director
  additional_fields: additional/bluecoat/director
transform:
  engine: elastic
  variant: filebeat.bluecoat_director.default
catalogue:
  package: bluecoat
  data_stream: director
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.bluecoat_director.default
