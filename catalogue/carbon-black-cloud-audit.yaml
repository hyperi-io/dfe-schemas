# Catalogue source carbon-black-cloud-audit: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: carbon-black-cloud-audit
display_name: carbon_black_cloud.audit
description: The audit data stream of the Elastic carbon_black_cloud integration.
match:
  field: data_stream.dataset
  operator: equals
  value: carbon_black_cloud.audit
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/carbon_black_cloud/audit
  additional_fields: additional/carbon_black_cloud/audit
transform:
  engine: elastic
  variant: filebeat.carbon_black_cloud_audit.default
catalogue:
  package: carbon_black_cloud
  data_stream: audit
  intakes: [beats]
  variants:
    - filebeat.carbon_black_cloud_audit.default
