# Catalogue source cassandra-metrics: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: cassandra-metrics
display_name: cassandra.metrics
description: The metrics data stream of the Elastic cassandra integration.
match:
  field: data_stream.dataset
  operator: equals
  value: cassandra.metrics
transform:
  engine: elastic
  variant: filebeat.cassandra_metrics.default
catalogue:
  package: cassandra
  data_stream: metrics
  intakes: [beats]
  variants:
    - filebeat.cassandra_metrics.default
