# Catalogue source cisco-duo-telephony: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: cisco-duo-telephony
display_name: cisco_duo.telephony
description: The telephony data stream of the Elastic cisco_duo integration.
match:
