# Catalogue source cisco-ftd: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: cisco-ftd
display_name: cisco_ftd.log
description: The log data stream of the Elastic cisco_ftd integration.
match:
  field: _source
  operator: equals
  value: cisco-ftd
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/cisco_ftd/log
  additional_fields: additional/cisco_ftd/log
transform:
  engine: elastic
  variant: filebeat.cisco_ftd.default
catalogue:
  package: cisco_ftd
  data_stream: log
  intakes: [beats, receiver]
  framing: line
  variants:
    - filebeat.cisco_ftd.default
  detect:
    order: 90
    markers:
      - priority: 55
        any:
          - "%FTD-"
          - "%NGIPS-"
          - "%ASA-4-4300"
          - "%ASA-6-4300"
          - "%ASA-3-4300"
          - "%ASA-1-4300"
          - "%ASA-2-4300"
          - "%ASA-5-4300"
          - "%ASA-7-4300"
          - "ftd["
          - "mojo_server.pl: "
          - "sfdccsm: "
          - "ActionQueueScrape.pl: "
          - "platformSettingEdit.cgi: "
          - "ChangeReconciliation.cgi: "
          - "lights_out_mgmt.cgi: "
        note: "%FTD/%NGIPS ids, ASA ids 4300xx and the FMC process names"
