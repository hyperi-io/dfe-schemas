# Catalogue source cisco-meraki: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: cisco-meraki
display_name: cisco_meraki.log
description: The log data stream of the Elastic cisco_meraki integration.
match:
  field: _source
  operator: equals
  value: cisco-meraki
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/cisco_meraki/log
  additional_fields: additional/cisco_meraki/log
transform:
  engine: elastic
  variant: filebeat.cisco_meraki.default
catalogue:
  package: cisco_meraki
  data_stream: log
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.cisco_meraki.default
  detect:
    order: 120
    markers:
      - priority: 50
        any:
          - " airmarshal_events "
          - " events type="
          - " flows allow src="
          - " flows deny src="
          - " ip_flow_start src="
          - " ip_flow_end src="
          - " urls src="
          - " ids-alerts "
          - " security_event "
          - " firewall src="
          - "_firewall src="
          - " flows src="
          - " events Site-to-Site VPN:"
          - " events dhcp "
          - " events client_vpn_connect "
          - " events carrier_change "
          - " events Blocked ARP Packet "
        note: "Meraki event types after the epoch.nanos header"
