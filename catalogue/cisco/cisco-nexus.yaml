# Catalogue source cisco-nexus: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: cisco-nexus
display_name: cisco_nexus.log
description: The log data stream of the Elastic cisco_nexus integration.
match:
  field: _source
  operator: equals
  value: cisco-nexus
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/cisco_nexus/log
  additional_fields: additional/cisco_nexus/log
transform:
  engine: elastic
  variant: filebeat.cisco_nexus.default
catalogue:
  package: cisco_nexus
  data_stream: log
  intakes: [beats, receiver]
  framing: line
  variants:
    - filebeat.cisco_nexus.default
  detect:
    order: 130
    markers:
      - priority: 53
        any:
          - "%ETHPORT-"
          - "%L2FM-"
          - "%VPC-"
          - "%SYSMGR-"
          - "%VSHD-"
          - "%HMM-"
          - "SYSTEM_MSG:"
          - "AAA_ACCOUNTING_MESSAGE"
        note: "NX-OS-only facilities"
      - priority: 53
        any:
          - " Jan "
          - " Feb "
          - " Mar "
          - " Apr "
          - " May "
          - " Jun "
          - " Jul "
          - " Aug "
          - " Sep "
          - " Oct "
          - " Nov "
          - " Dec "
        verify: nexus_stamp
        note: "year-first stamp, which IOS does not write"
