# Catalogue source claroty-xdome-alert: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: claroty-xdome-alert
display_name: claroty_xdome.alert
description: The alert data stream of the Elastic claroty_xdome integration.
match:
  field: data_stream.dataset
  operator: equals
  value: claroty_xdome.alert
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/claroty_xdome/alert
  additional_fields: additional/claroty_xdome/alert
transform:
  engine: elastic
  variant: filebeat.claroty_xdome_alert.default
catalogue:
  package: claroty_xdome
  data_stream: alert
  intakes: [beats]
  variants:
    - filebeat.claroty_xdome_alert.default
