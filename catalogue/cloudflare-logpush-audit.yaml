# Catalogue source cloudflare-logpush-audit: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: cloudflare-logpush-audit
display_name: cloudflare_logpush.audit
description: The audit data stream of the Elastic cloudflare_logpush integration.
match:
  field: _source
  operator: equals
  value: cloudflare-logpush-audit
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/cloudflare_logpush/audit
  additional_fields: additional/cloudflare_logpush/audit
transform:
  engine: elastic
  variant: filebeat.cloudflare_logpush_audit.default
catalogue:
  package: cloudflare_logpush
  data_stream: audit
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.cloudflare_logpush_audit.default
