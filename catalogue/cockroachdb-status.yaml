# Catalogue source cockroachdb-status: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: cockroachdb-status
display_name: cockroachdb.status
description: The status data stream of the Elastic cockroachdb integration.
match:
  field: data_stream.dataset
  operator: equals
  value: cockroachdb.status
transform:
  engine: elastic
  variant: filebeat.cockroachdb_status.default
catalogue:
  package: cockroachdb
  data_stream: status
  intakes: [beats]
  variants:
    - filebeat.cockroachdb_status.default
