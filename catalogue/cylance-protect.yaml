# Catalogue source cylance-protect: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: cylance-protect
display_name: cylance.protect
description: The protect data stream of the Elastic cylance integration.
match:
  field: _source
  operator: equals
  value: cylance-protect
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/cylance/protect
  additional_fields: additional/cylance/protect
transform:
  engine: elastic
  variant: filebeat.cylance_protect.default
catalogue:
  package: cylance
  data_stream: protect
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.cylance_protect.default
