# Catalogue source doppler-activity: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: doppler-activity
display_name: doppler.activity
description: The activity data stream of the Elastic doppler integration.
match:
  field: _source
  operator: equals
  value: doppler-activity
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/doppler/activity
  additional_fields: additional/doppler/activity
transform:
  engine: elastic
  variant: filebeat.doppler_activity.default
catalogue:
  package: doppler
  data_stream: activity
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.doppler_activity.default
