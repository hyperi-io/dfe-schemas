# Catalogue source doppler-secret-read: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: doppler-secret-read
display_name: doppler.secret_read
description: The secret_read data stream of the Elastic doppler integration.
match:
  field: data_stream.dataset
  operator: equals
  value: doppler.secret_read
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/doppler/secret_read
  additional_fields: additional/doppler/secret_read
transform:
  engine: elastic
  variant: filebeat.doppler_secret_read.default
catalogue:
  package: doppler
  data_stream: secret_read
  intakes: [beats]
  variants:
    - filebeat.doppler_secret_read.default
