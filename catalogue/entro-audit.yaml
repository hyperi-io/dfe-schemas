# Catalogue source entro-audit: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: entro-audit
display_name: entro.audit
description: The audit data stream of the Elastic entro integration.
match:
  field: data_stream.dataset
  operator: equals
  value: entro.audit
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/entro/audit
  additional_fields: additional/entro/audit
transform:
  engine: elastic
  variant: filebeat.entro_audit.default
catalogue:
  package: entro
  data_stream: audit
  intakes: [beats]
  variants:
    - filebeat.entro_audit.default
