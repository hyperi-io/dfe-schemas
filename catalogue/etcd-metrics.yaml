# Catalogue source etcd-metrics: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: etcd-metrics
display_name: etcd.metrics
description: The metrics data stream of the Elastic etcd integration.
match:
  field: data_stream.dataset
  operator: equals
  value: etcd.metrics
transform:
  engine: elastic
  variant: filebeat.etcd_metrics.default
catalogue:
  package: etcd
  data_stream: metrics
  intakes: [beats]
  variants:
    - filebeat.etcd_metrics.default
