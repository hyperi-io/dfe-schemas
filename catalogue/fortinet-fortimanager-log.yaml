# Catalogue source fortinet-fortimanager-log: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: fortinet-fortimanager-log
display_name: fortinet_fortimanager.log
description: The log data stream of the Elastic fortinet_fortimanager integration.
match:
  field: _source
  operator: equals
  value: fortinet-fortimanager-log
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/fortinet_fortimanager/log
  additional_fields: additional/fortinet_fortimanager/log
transform:
  engine: elastic
  variant: filebeat.fortinet_fortimanager_log.default
catalogue:
  package: fortinet_fortimanager
  data_stream: log
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.fortinet_fortimanager_log.default
