# Catalogue source fortinet-forticlient-log: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: fortinet-forticlient-log
display_name: fortinet_forticlient.log
description: The log data stream of the Elastic fortinet_forticlient integration.
match:
  field: _source
  operator: equals
  value: fortinet-forticlient-log
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/fortinet_forticlient/log
  additional_fields: additional/fortinet_forticlient/log
transform:
  engine: elastic
  variant: filebeat.fortinet_forticlient_log.default
catalogue:
  package: fortinet_forticlient
  data_stream: log
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.fortinet_forticlient_log.default
