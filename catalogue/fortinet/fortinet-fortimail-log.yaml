# Catalogue source fortinet-fortimail-log: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: fortinet-fortimail-log
display_name: fortinet_fortimail.log
description: The log data stream of the Elastic fortinet_fortimail integration.
match:
  field: _source
  operator: equals
  value: fortinet-fortimail-log
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/fortinet_fortimail/log
  additional_fields: additional/fortinet_fortimail/log
transform:
  engine: elastic
  variant: filebeat.fortinet_fortimail_log.default
catalogue:
  package: fortinet_fortimail
  data_stream: log
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.fortinet_fortimail_log.default
