# Catalogue source fortinet: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: fortinet
display_name: fortinet_fortigate.log
description: The log data stream of the Elastic fortinet_fortigate integration.
match:
  field: _source
  operator: equals
  value: fortinet
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/fortinet_fortigate/log
  additional_fields: additional/fortinet_fortigate/log
transform:
  engine: elastic
  variant: filebeat.fortinet.default
catalogue:
  package: fortinet_fortigate
  data_stream: log
  intakes: [beats, receiver]
  framing: line
  variants:
    - filebeat.fortinet.default
