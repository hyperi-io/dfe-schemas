# Catalogue source gcp-gke: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: gcp-gke
display_name: gcp.gke
description: The gke data stream of the Elastic gcp integration.
match:
  field: data_stream.dataset
  operator: equals
  value: gcp.gke
transform:
  engine: elastic
  variant: filebeat.gcp_gke.default
catalogue:
  package: gcp
  data_stream: gke
  intakes: [beats]
  variants:
    - filebeat.gcp_gke.default
