# Catalogue source gcp-redis: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: gcp-redis
display_name: gcp.redis
description: The redis data stream of the Elastic gcp integration.
match:
  field: data_stream.dataset
  operator: equals
  value: gcp.redis
transform:
  engine: elastic
  variant: filebeat.gcp_redis.default
catalogue:
  package: gcp
  data_stream: redis
  intakes: [beats]
  variants:
    - filebeat.gcp_redis.default
