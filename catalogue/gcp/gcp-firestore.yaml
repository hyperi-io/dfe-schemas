# Catalogue source gcp-firestore: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: gcp-firestore
display_name: gcp.firestore
description: The firestore data stream of the Elastic gcp integration.
match:
  field: data_stream.dataset
  operator: equals
  value: gcp.firestore
transform:
  engine: elastic
  variant: filebeat.gcp_firestore.default
catalogue:
  package: gcp
  data_stream: firestore
  intakes: [beats]
  variants:
    - filebeat.gcp_firestore.default
