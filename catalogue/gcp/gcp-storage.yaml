# Catalogue source gcp-storage: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: gcp-storage
display_name: gcp.storage
description: The storage data stream of the Elastic gcp integration.
match:
  field: data_stream.dataset
  operator: equals
  value: gcp.storage
transform:
  engine: elastic
  variant: filebeat.gcp_storage.default
catalogue:
  package: gcp
  data_stream: storage
  intakes: [beats]
  variants:
    - filebeat.gcp_storage.default
