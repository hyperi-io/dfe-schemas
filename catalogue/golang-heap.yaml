# Catalogue source golang-heap: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: golang-heap
display_name: golang.heap
description: The heap data stream of the Elastic golang integration.
match:
  field: data_stream.dataset
  operator: equals
  value: golang.heap
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/golang/heap
  additional_fields: additional/golang/heap
transform:
  engine: elastic
  variant: filebeat.golang_heap.default
catalogue:
  package: golang
  data_stream: heap
  intakes: [beats]
  variants:
    - filebeat.golang_heap.default
