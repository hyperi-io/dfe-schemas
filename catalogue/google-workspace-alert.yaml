# Catalogue source google-workspace-alert: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: google-workspace-alert
display_name: google_workspace.alert
description: The alert data stream of the Elastic google_workspace integration.
match:
  field: data_stream.dataset
  operator: equals
  value: google_workspace.alert
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/google_workspace/alert
  additional_fields: additional/google_workspace/alert
transform:
  engine: elastic
  variant: filebeat.google_workspace_alert.default
catalogue:
  package: google_workspace
  data_stream: alert
  intakes: [beats]
  variants:
    - filebeat.google_workspace_alert.default
