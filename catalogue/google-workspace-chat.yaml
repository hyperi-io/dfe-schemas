# Catalogue source google-workspace-chat: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: google-workspace-chat
display_name: google_workspace.chat
description: The chat data stream of the Elastic google_workspace integration.
fetcher:
  source_type: google_workspace
  topic: own
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/google_workspace/chat
  additional_fields: additional/google_workspace/chat
transform:
  engine: elastic
  variant: filebeat.google_workspace_chat.default
catalogue:
  package: google_workspace
  data_stream: chat
  intakes: [beats, fetcher]
  variants:
    - filebeat.google_workspace_chat.default
