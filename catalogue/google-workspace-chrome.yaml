# Catalogue source google-workspace-chrome: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: google-workspace-chrome
display_name: google_workspace.chrome
description: The chrome data stream of the Elastic google_workspace integration.
fetcher:
  source_type: google_workspace
  topic: own
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/google_workspace/chrome
  additional_fields: additional/google_workspace/chrome
transform:
  engine: elastic
  variant: filebeat.google_workspace_chrome.default
catalogue:
  package: google_workspace
  data_stream: chrome
  intakes: [beats, fetcher]
  variants:
    - filebeat.google_workspace_chrome.default
