# Catalogue source google-workspace-vault: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: google-workspace-vault
display_name: google_workspace.vault
description: The vault data stream of the Elastic google_workspace integration.
fetcher:
  source_type: google_workspace
  topic: own
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/google_workspace/vault
  additional_fields: additional/google_workspace/vault
transform:
  engine: elastic
  variant: filebeat.google_workspace_vault.default
catalogue:
  package: google_workspace
  data_stream: vault
  intakes: [beats, fetcher]
  variants:
    - filebeat.google_workspace_vault.default
