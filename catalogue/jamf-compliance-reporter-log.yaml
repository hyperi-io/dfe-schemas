# Catalogue source jamf-compliance-reporter-log: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: jamf-compliance-reporter-log
display_name: jamf_compliance_reporter.log
description: The log data stream of the Elastic jamf_compliance_reporter integration.
match:
  field: _source
  operator: equals
  value: jamf-compliance-reporter-log
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/jamf_compliance_reporter/log
  additional_fields: additional/jamf_compliance_reporter/log
transform:
  engine: elastic
  variant: filebeat.jamf_compliance_reporter_log.default
catalogue:
  package: jamf_compliance_reporter
  data_stream: log
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.jamf_compliance_reporter_log.default
