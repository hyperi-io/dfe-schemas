# Catalogue source kafka-topic: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: kafka-topic
display_name: kafka.topic
description: The topic data stream of the Elastic kafka integration.
match:
  field: data_stream.dataset
  operator: equals
  value: kafka.topic
transform:
  engine: elastic
  variant: filebeat.kafka_topic.default
catalogue:
  package: kafka
  data_stream: topic
  intakes: [beats]
  variants:
    - filebeat.kafka_topic.default
