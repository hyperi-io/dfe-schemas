# Catalogue source kubernetes-container-logs: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: kubernetes-container-logs
display_name: kubernetes.container_logs
description: The container_logs data stream of the Elastic kubernetes integration.
match:
  field: data_stream.dataset
  operator: equals
  value: kubernetes.container_logs
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/kubernetes/container_logs
  additional_fields: additional/kubernetes/container_logs
transform:
  engine: elastic
  variant: filebeat.kubernetes_container_logs.default
catalogue:
  package: kubernetes
  data_stream: container_logs
  intakes: [beats]
  variants:
    - filebeat.kubernetes_container_logs.default
