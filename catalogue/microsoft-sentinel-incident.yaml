  operator: equals
  value: microsoft_sentinel.incident
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/microsoft_sentinel/incident
  additional_fields: additional/microsoft_sentinel/incident
transform:
  engine: elastic
  variant: filebeat.microsoft_sentinel_incident.default
catalogue:
  package: microsoft_sentinel
  data_stream: incident
  intakes: [beats]
  variants:
    - filebeat.microsoft_sentinel_incident.default
