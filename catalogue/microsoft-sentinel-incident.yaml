# Catalogue source microsoft-sentinel-incident: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: microsoft-sentinel-incident
display_name: microsoft_sentinel.incident
description: The incident data stream of the Elastic microsoft_sentinel integration.
match:
