# Catalogue source mimecast-ttp-ip-logs: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: mimecast-ttp-ip-logs
display_name: mimecast.ttp_ip_logs
description: The ttp_ip_logs data stream of the Elastic mimecast integration.
match:
  field: data_stream.dataset
  operator: equals
  value: mimecast.ttp_ip_logs
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/mimecast/ttp_ip_logs
  additional_fields: additional/mimecast/ttp_ip_logs
transform:
  engine: elastic
  variant: filebeat.mimecast_ttp_ip_logs.default
catalogue:
  package: mimecast
  data_stream: ttp_ip_logs
  intakes: [beats]
  variants:
    - filebeat.mimecast_ttp_ip_logs.default
