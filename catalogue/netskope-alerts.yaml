# Catalogue source netskope-alerts: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: netskope-alerts
display_name: netskope.alerts
description: The alerts data stream of the Elastic netskope integration.
match:
  field: _source
  operator: equals
  value: netskope-alerts
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/netskope/alerts
  additional_fields: additional/netskope/alerts
transform:
  engine: elastic
  variant: filebeat.netskope_alerts.default
catalogue:
  package: netskope
  data_stream: alerts
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.netskope_alerts.default
