# Catalogue source netskope-events: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: netskope-events
display_name: netskope.events
description: The events data stream of the Elastic netskope integration.
match:
  field: _source
  operator: equals
  value: netskope-events
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/netskope/events
  additional_fields: additional/netskope/events
transform:
  engine: elastic
  variant: filebeat.netskope_events.default
catalogue:
  package: netskope
  data_stream: events
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.netskope_events.default
