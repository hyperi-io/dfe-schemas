# Catalogue source network-traffic-amqp: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: network-traffic-amqp
display_name: network_traffic.amqp
description: The amqp data stream of the Elastic network_traffic integration.
match:
  field: data_stream.dataset
  operator: equals
  value: network_traffic.amqp
transform:
  engine: elastic
  variant: filebeat.network_traffic_amqp.default
catalogue:
  package: network_traffic
  data_stream: amqp
  intakes: [beats]
  variants:
    - filebeat.network_traffic_amqp.default
