# Catalogue source network-traffic-http: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: network-traffic-http
display_name: network_traffic.http
description: The http data stream of the Elastic network_traffic integration.
match:
  field: data_stream.dataset
  operator: equals
  value: network_traffic.http
transform:
  engine: elastic
  variant: filebeat.network_traffic_http.default
catalogue:
  package: network_traffic
  data_stream: http
  intakes: [beats]
  variants:
    - filebeat.network_traffic_http.default
