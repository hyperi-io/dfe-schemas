# Catalogue source network-traffic-mongodb: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: network-traffic-mongodb
display_name: network_traffic.mongodb
description: The mongodb data stream of the Elastic network_traffic integration.
match:
  field: data_stream.dataset
  operator: equals
  value: network_traffic.mongodb
transform:
  engine: elastic
  variant: filebeat.network_traffic_mongodb.default
catalogue:
  package: network_traffic
  data_stream: mongodb
  intakes: [beats]
  variants:
    - filebeat.network_traffic_mongodb.default
