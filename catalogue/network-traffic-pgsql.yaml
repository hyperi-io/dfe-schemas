# Catalogue source network-traffic-pgsql: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: network-traffic-pgsql
display_name: network_traffic.pgsql
description: The pgsql data stream of the Elastic network_traffic integration.
match:
  field: data_stream.dataset
  operator: equals
  value: network_traffic.pgsql
transform:
  engine: elastic
  variant: filebeat.network_traffic_pgsql.default
catalogue:
  package: network_traffic
  data_stream: pgsql
  intakes: [beats]
  variants:
    - filebeat.network_traffic_pgsql.default
