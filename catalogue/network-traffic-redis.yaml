# Catalogue source network-traffic-redis: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: network-traffic-redis
display_name: network_traffic.redis
description: The redis data stream of the Elastic network_traffic integration.
match:
  field: data_stream.dataset
  operator: equals
  value: network_traffic.redis
transform:
  engine: elastic
  variant: filebeat.network_traffic_redis.default
catalogue:
  package: network_traffic
  data_stream: redis
  intakes: [beats]
  variants:
    - filebeat.network_traffic_redis.default
