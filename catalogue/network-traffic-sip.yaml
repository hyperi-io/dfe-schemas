# Catalogue source network-traffic-sip: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: network-traffic-sip
display_name: network_traffic.sip
description: The sip data stream of the Elastic network_traffic integration.
match:
  field: data_stream.dataset
  operator: equals
  value: network_traffic.sip
transform:
  engine: elastic
  variant: filebeat.network_traffic_sip.default
catalogue:
  package: network_traffic
  data_stream: sip
  intakes: [beats]
  variants:
    - filebeat.network_traffic_sip.default
