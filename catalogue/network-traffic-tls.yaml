# Catalogue source network-traffic-tls: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: network-traffic-tls
display_name: network_traffic.tls
description: The tls data stream of the Elastic network_traffic integration.
match:
  field: data_stream.dataset
  operator: equals
  value: network_traffic.tls
transform:
  engine: elastic
  variant: filebeat.network_traffic_tls.default
catalogue:
  package: network_traffic
  data_stream: tls
  intakes: [beats]
  variants:
    - filebeat.network_traffic_tls.default
