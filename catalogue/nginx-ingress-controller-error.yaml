# Catalogue source nginx-ingress-controller-error: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: nginx-ingress-controller-error
display_name: nginx_ingress_controller.error
description: The error data stream of the Elastic nginx_ingress_controller integration.
match:
  field: data_stream.dataset
  operator: equals
  value: nginx_ingress_controller.error
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/nginx_ingress_controller/error
  additional_fields: additional/nginx_ingress_controller/error
transform:
  engine: elastic
  variant: filebeat.nginx_ingress_controller_error.default
catalogue:
  package: nginx_ingress_controller
  data_stream: error
  intakes: [beats]
  variants:
    - filebeat.nginx_ingress_controller_error.default
