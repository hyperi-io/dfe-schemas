# Catalogue source nozomi-networks-health: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: nozomi-networks-health
display_name: nozomi_networks.health
description: The health data stream of the Elastic nozomi_networks integration.
match:
  field: data_stream.dataset
  operator: equals
  value: nozomi_networks.health
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/nozomi_networks/health
  additional_fields: additional/nozomi_networks/health
transform:
  engine: elastic
  variant: filebeat.nozomi_networks_health.default
catalogue:
  package: nozomi_networks
  data_stream: health
  intakes: [beats]
  variants:
    - filebeat.nozomi_networks_health.default
