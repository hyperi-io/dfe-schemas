# Catalogue source nozomi-networks-session: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: nozomi-networks-session
display_name: nozomi_networks.session
description: The session data stream of the Elastic nozomi_networks integration.
match:
  field: data_stream.dataset
  operator: equals
  value: nozomi_networks.session
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/nozomi_networks/session
  additional_fields: additional/nozomi_networks/session
transform:
  engine: elastic
  variant: filebeat.nozomi_networks_session.default
catalogue:
  package: nozomi_networks
  data_stream: session
  intakes: [beats]
  variants:
    - filebeat.nozomi_networks_session.default
