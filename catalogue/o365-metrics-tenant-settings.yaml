# Catalogue source o365-metrics-tenant-settings: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: o365-metrics-tenant-settings
display_name: o365_metrics.tenant_settings
description: The tenant_settings data stream of the Elastic o365_metrics integration.
match:
  field: data_stream.dataset
  operator: equals
  value: o365_metrics.tenant_settings
transform:
  engine: elastic
  variant: filebeat.o365_metrics_tenant_settings.default
catalogue:
  package: o365_metrics
  data_stream: tenant_settings
  intakes: [beats]
  variants:
    - filebeat.o365_metrics_tenant_settings.default
