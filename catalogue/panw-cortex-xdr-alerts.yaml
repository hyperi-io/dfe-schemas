# Catalogue source panw-cortex-xdr-alerts: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: panw-cortex-xdr-alerts
display_name: panw_cortex_xdr.alerts
description: The alerts data stream of the Elastic panw_cortex_xdr integration.
match:
  field: data_stream.dataset
  operator: equals
  value: panw_cortex_xdr.alerts
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/panw_cortex_xdr/alerts
  additional_fields: additional/panw_cortex_xdr/alerts
transform:
  engine: elastic
  variant: filebeat.panw_cortex_xdr_alerts.default
catalogue:
  package: panw_cortex_xdr
  data_stream: alerts
  intakes: [beats]
  variants:
    - filebeat.panw_cortex_xdr_alerts.default
