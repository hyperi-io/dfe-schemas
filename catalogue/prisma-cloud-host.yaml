# Catalogue source prisma-cloud-host: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: prisma-cloud-host
display_name: prisma_cloud.host
description: The host data stream of the Elastic prisma_cloud integration.
match:
  field: _source
  operator: equals
  value: prisma-cloud-host
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/prisma_cloud/host
  additional_fields: additional/prisma_cloud/host
transform:
  engine: elastic
  variant: filebeat.prisma_cloud_host.default
catalogue:
  package: prisma_cloud
  data_stream: host
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.prisma_cloud_host.default
