# Catalogue source servicenow-event: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: servicenow-event
display_name: servicenow.event
description: The event data stream of the Elastic servicenow integration.
match:
  field: data_stream.dataset
  operator: equals
  value: servicenow.event
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/servicenow/event
  additional_fields: additional/servicenow/event
transform:
  engine: elastic
  variant: filebeat.servicenow_event.default
catalogue:
  package: servicenow
  data_stream: event
  intakes: [beats]
  variants:
    - filebeat.servicenow_event.default
