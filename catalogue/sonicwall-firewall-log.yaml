# Catalogue source sonicwall-firewall-log: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: sonicwall-firewall-log
display_name: sonicwall_firewall.log
description: The log data stream of the Elastic sonicwall_firewall integration.
match:
  field: _source
  operator: equals
  value: sonicwall-firewall-log
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/sonicwall_firewall/log
  additional_fields: additional/sonicwall_firewall/log
transform:
  engine: elastic
  variant: filebeat.sonicwall_firewall_log.default
catalogue:
  package: sonicwall_firewall
  data_stream: log
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.sonicwall_firewall_log.default
