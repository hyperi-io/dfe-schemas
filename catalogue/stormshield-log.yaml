# Catalogue source stormshield-log: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: stormshield-log
display_name: stormshield.log
description: The log data stream of the Elastic stormshield integration.
match:
  field: _source
  operator: equals
  value: stormshield-log
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/stormshield/log
  additional_fields: additional/stormshield/log
transform:
  engine: elastic
  variant: filebeat.stormshield_log.default
catalogue:
  package: stormshield
  data_stream: log
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.stormshield_log.default
