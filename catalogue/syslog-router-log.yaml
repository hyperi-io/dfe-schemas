# Catalogue source syslog-router-log: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: syslog-router-log
display_name: syslog_router.log
description: The log data stream of the Elastic syslog_router integration.
match:
  field: _source
  operator: equals
  value: syslog-router-log
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/syslog_router/log
  additional_fields: additional/syslog_router/log
transform:
  engine: elastic
  variant: filebeat.syslog_router_log.default
catalogue:
  package: syslog_router
  data_stream: log
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.syslog_router_log.default
