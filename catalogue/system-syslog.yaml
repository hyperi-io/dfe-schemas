# Catalogue source system-syslog: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: system-syslog
display_name: system.syslog
description: The syslog data stream of the Elastic system integration.
match:
  field: data_stream.dataset
  operator: equals
  value: system.syslog
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/system/syslog
  additional_fields: additional/system/syslog
transform:
  engine: elastic
  variant: filebeat.system_syslog.default
catalogue:
  package: system
  data_stream: syslog
  intakes: [beats]
  variants:
    - filebeat.system_syslog.default
