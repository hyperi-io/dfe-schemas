# Catalogue source tenable-sc-asset: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: tenable-sc-asset
display_name: tenable_sc.asset
description: The asset data stream of the Elastic tenable_sc integration.
match:
  field: data_stream.dataset
  operator: equals
  value: tenable_sc.asset
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/tenable_sc/asset
  additional_fields: additional/tenable_sc/asset
transform:
  engine: elastic
  variant: filebeat.tenable_sc_asset.default
catalogue:
  package: tenable_sc
  data_stream: asset
  intakes: [beats]
  variants:
    - filebeat.tenable_sc_asset.default
