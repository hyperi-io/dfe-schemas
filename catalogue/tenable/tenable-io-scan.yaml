# Catalogue source tenable-io-scan: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: tenable-io-scan
display_name: tenable_io.scan
description: The scan data stream of the Elastic tenable_io integration.
match:
  field: data_stream.dataset
  operator: equals
  value: tenable_io.scan
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/tenable_io/scan
  additional_fields: additional/tenable_io/scan
transform:
  engine: elastic
  variant: filebeat.tenable_io_scan.default
catalogue:
  package: tenable_io
  data_stream: scan
  intakes: [beats]
  variants:
    - filebeat.tenable_io_scan.default
