# Catalogue source tencent-cloud-clb: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: tencent-cloud-clb
display_name: tencent_cloud.clb
description: The clb data stream of the Elastic tencent_cloud integration.
match:
