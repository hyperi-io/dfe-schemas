# Catalogue source ti-anomali-threatstream: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: ti-anomali-threatstream
display_name: ti_anomali.threatstream
description: The threatstream data stream of the Elastic ti_anomali integration.
match:
  field: _source
  operator: equals
  value: ti-anomali-threatstream
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/ti_anomali/threatstream
  additional_fields: additional/ti_anomali/threatstream
transform:
  engine: elastic
  variant: filebeat.ti_anomali_threatstream.default
catalogue:
  package: ti_anomali
  data_stream: threatstream
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.ti_anomali_threatstream.default
