# Catalogue source ti-eset-apt: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: ti-eset-apt
display_name: ti_eset.apt
description: The apt data stream of the Elastic ti_eset integration.
match:
  field: data_stream.dataset
  operator: equals
  value: ti_eset.apt
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/ti_eset/apt
  additional_fields: additional/ti_eset/apt
transform:
  engine: elastic
  variant: filebeat.ti_eset_apt.default
catalogue:
  package: ti_eset
  data_stream: apt
  intakes: [beats]
  variants:
    - filebeat.ti_eset_apt.default
