# Catalogue source ti-eset-ip: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: ti-eset-ip
display_name: ti_eset.ip
description: The ip data stream of the Elastic ti_eset integration.
match:
  field: data_stream.dataset
  operator: equals
  value: ti_eset.ip
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/ti_eset/ip
  additional_fields: additional/ti_eset/ip
transform:
  engine: elastic
  variant: filebeat.ti_eset_ip.default
catalogue:
  package: ti_eset
  data_stream: ip
  intakes: [beats]
  variants:
    - filebeat.ti_eset_ip.default
