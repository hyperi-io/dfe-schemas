# Catalogue source ti-eset-url: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: ti-eset-url
display_name: ti_eset.url
description: The url data stream of the Elastic ti_eset integration.
match:
  field: data_stream.dataset
  operator: equals
  value: ti_eset.url
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/ti_eset/url
  additional_fields: additional/ti_eset/url
transform:
  engine: elastic
  variant: filebeat.ti_eset_url.default
catalogue:
  package: ti_eset
  data_stream: url
  intakes: [beats]
  variants:
    - filebeat.ti_eset_url.default
