# Catalogue source ti-misp-threat: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: ti-misp-threat
display_name: ti_misp.threat
description: The threat data stream of the Elastic ti_misp integration.
match:
  field: data_stream.dataset
  operator: equals
  value: ti_misp.threat
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/ti_misp/threat
  additional_fields: additional/ti_misp/threat
transform:
  engine: elastic
  variant: filebeat.ti_misp_threat.default
catalogue:
  package: ti_misp
  data_stream: threat
  intakes: [beats]
  variants:
    - filebeat.ti_misp_threat.default
