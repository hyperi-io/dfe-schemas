# Catalogue source tines-audit-logs: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: tines-audit-logs
display_name: tines.audit_logs
description: The audit_logs data stream of the Elastic tines integration.
match:
  field: data_stream.dataset
  operator: equals
  value: tines.audit_logs
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/tines/audit_logs
  additional_fields: additional/tines/audit_logs
transform:
  engine: elastic
  variant: filebeat.tines_audit_logs.default
catalogue:
  package: tines
  data_stream: audit_logs
  intakes: [beats]
  variants:
    - filebeat.tines_audit_logs.default
