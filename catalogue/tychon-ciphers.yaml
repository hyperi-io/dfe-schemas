# Catalogue source tychon-ciphers: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: tychon-ciphers
display_name: tychon.ciphers
description: The ciphers data stream of the Elastic tychon integration.
match:
  field: data_stream.dataset
  operator: equals
  value: tychon.ciphers
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/tychon/ciphers
  additional_fields: additional/tychon/ciphers
transform:
  engine: elastic
  variant: filebeat.tychon_ciphers.default
catalogue:
  package: tychon
  data_stream: ciphers
  intakes: [beats]
  variants:
    - filebeat.tychon_ciphers.default
