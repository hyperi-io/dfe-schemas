# Catalogue source beyondtrust-isi-incident: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: beyondtrust-isi-incident
display_name: beyondtrust_isi.incident
description: The incident data stream of the Elastic beyondtrust_isi integration.
match:
  field: _source
  operator: equals
  value: beyondtrust-isi-incident
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/beyondtrust_isi/incident
  additional_fields: additional/beyondtrust_isi/incident
transform:
  engine: elastic
  variant: filebeat.beyondtrust_isi_incident.default
catalogue:
  package: beyondtrust_isi
  data_stream: incident
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.beyondtrust_isi_incident.default
