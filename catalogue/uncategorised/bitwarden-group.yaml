# Catalogue source bitwarden-group: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: bitwarden-group
display_name: bitwarden.group
description: The group data stream of the Elastic bitwarden integration.
match:
  field: data_stream.dataset
  operator: equals
  value: bitwarden.group
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/bitwarden/group
  additional_fields: additional/bitwarden/group
transform:
  engine: elastic
  variant: filebeat.bitwarden_group.default
catalogue:
  package: bitwarden
  data_stream: group
  intakes: [beats]
  variants:
    - filebeat.bitwarden_group.default
