# Catalogue source carbonblack-edr-log: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: carbonblack-edr-log
display_name: carbonblack_edr.log
description: The log data stream of the Elastic carbonblack_edr integration.
match:
  field: _source
  operator: equals
  value: carbonblack-edr-log
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/carbonblack_edr/log
  additional_fields: additional/carbonblack_edr/log
transform:
  engine: elastic
  variant: filebeat.carbonblack_edr_log.default
catalogue:
  package: carbonblack_edr
  data_stream: log
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.carbonblack_edr_log.default
