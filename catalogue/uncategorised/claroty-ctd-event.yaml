# Catalogue source claroty-ctd-event: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: claroty-ctd-event
display_name: claroty_ctd.event
description: The event data stream of the Elastic claroty_ctd integration.
match:
  field: _source
  operator: equals
  value: claroty-ctd-event
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/claroty_ctd/event
  additional_fields: additional/claroty_ctd/event
transform:
  engine: elastic
  variant: filebeat.claroty_ctd_event.default
catalogue:
  package: claroty_ctd
  data_stream: event
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.claroty_ctd_event.default
