# Catalogue source cloudflare-logpush-dns: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: cloudflare-logpush-dns
display_name: cloudflare_logpush.dns
description: The dns data stream of the Elastic cloudflare_logpush integration.
match:
  field: _source
  operator: equals
  value: cloudflare-logpush-dns
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/cloudflare_logpush/dns
  additional_fields: additional/cloudflare_logpush/dns
transform:
  engine: elastic
  variant: filebeat.cloudflare_logpush_dns.default
catalogue:
  package: cloudflare_logpush
  data_stream: dns
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.cloudflare_logpush_dns.default
