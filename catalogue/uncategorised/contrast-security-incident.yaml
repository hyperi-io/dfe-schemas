# Catalogue source contrast-security-incident: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: contrast-security-incident
display_name: contrast_security.incident
description: The incident data stream of the Elastic contrast_security integration.
match:
  field: data_stream.dataset
  operator: equals
  value: contrast_security.incident
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/contrast_security/incident
  additional_fields: additional/contrast_security/incident
transform:
  engine: elastic
  variant: filebeat.contrast_security_incident.default
catalogue:
  package: contrast_security
  data_stream: incident
  intakes: [beats]
  variants:
    - filebeat.contrast_security_incident.default
