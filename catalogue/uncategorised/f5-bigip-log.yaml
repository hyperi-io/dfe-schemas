# Catalogue source f5-bigip-log: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: f5-bigip-log
display_name: f5_bigip.log
description: The log data stream of the Elastic f5_bigip integration.
match:
  field: _source
  operator: equals
  value: f5-bigip-log
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/f5_bigip/log
  additional_fields: additional/f5_bigip/log
transform:
  engine: elastic
  variant: filebeat.f5_bigip_log.default
catalogue:
  package: f5_bigip
  data_stream: log
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.f5_bigip_log.default
