# Catalogue source falco-alerts: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: falco-alerts
display_name: falco.alerts
description: The alerts data stream of the Elastic falco integration.
match:
  field: _source
  operator: equals
  value: falco-alerts
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/falco/alerts
  additional_fields: additional/falco/alerts
transform:
  engine: elastic
  variant: filebeat.falco_alerts.default
catalogue:
  package: falco
  data_stream: alerts
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.falco_alerts.default
