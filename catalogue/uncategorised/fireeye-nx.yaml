# Catalogue source fireeye-nx: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: fireeye-nx
display_name: fireeye.nx
description: The nx data stream of the Elastic fireeye integration.
match:
  field: _source
  operator: equals
  value: fireeye-nx
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/fireeye/nx
  additional_fields: additional/fireeye/nx
transform:
  engine: elastic
  variant: filebeat.fireeye_nx.default
catalogue:
  package: fireeye
  data_stream: nx
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.fireeye_nx.default
