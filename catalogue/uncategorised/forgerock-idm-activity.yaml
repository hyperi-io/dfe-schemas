# Catalogue source forgerock-idm-activity: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: forgerock-idm-activity
display_name: forgerock.idm_activity
description: The idm_activity data stream of the Elastic forgerock integration.
match:
  field: data_stream.dataset
  operator: equals
  value: forgerock.idm_activity
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/forgerock/idm_activity
  additional_fields: additional/forgerock/idm_activity
transform:
  engine: elastic
  variant: filebeat.forgerock_idm_activity.default
catalogue:
  package: forgerock
  data_stream: idm_activity
  intakes: [beats]
  variants:
    - filebeat.forgerock_idm_activity.default
