# Catalogue source forgerock-idm-config: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: forgerock-idm-config
display_name: forgerock.idm_config
description: The idm_config data stream of the Elastic forgerock integration.
match:
  field: data_stream.dataset
  operator: equals
  value: forgerock.idm_config
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/forgerock/idm_config
  additional_fields: additional/forgerock/idm_config
transform:
  engine: elastic
  variant: filebeat.forgerock_idm_config.default
catalogue:
  package: forgerock
  data_stream: idm_config
  intakes: [beats]
  variants:
    - filebeat.forgerock_idm_config.default
