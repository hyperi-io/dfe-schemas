# Catalogue source forgerock-idm-sync: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: forgerock-idm-sync
display_name: forgerock.idm_sync
description: The idm_sync data stream of the Elastic forgerock integration.
match:
  field: data_stream.dataset
  operator: equals
  value: forgerock.idm_sync
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/forgerock/idm_sync
  additional_fields: additional/forgerock/idm_sync
transform:
  engine: elastic
  variant: filebeat.forgerock_idm_sync.default
catalogue:
  package: forgerock
  data_stream: idm_sync
  intakes: [beats]
  variants:
    - filebeat.forgerock_idm_sync.default
