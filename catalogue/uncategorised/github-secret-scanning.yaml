# Catalogue source github-secret-scanning: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: github-secret-scanning
display_name: github.secret_scanning
description: The secret_scanning data stream of the Elastic github integration.
match:
  field: data_stream.dataset
  operator: equals
  value: github.secret_scanning
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/github/secret_scanning
  additional_fields: additional/github/secret_scanning
transform:
  engine: elastic
  variant: filebeat.github_secret_scanning.default
catalogue:
  package: github
  data_stream: secret_scanning
  intakes: [beats]
  variants:
    - filebeat.github_secret_scanning.default
