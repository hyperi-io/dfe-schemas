# Catalogue source grafana-logs: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: grafana-logs
display_name: grafana.logs
description: The logs data stream of the Elastic grafana integration.
match:
  field: data_stream.dataset
  operator: equals
  value: grafana.logs
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/grafana/logs
  additional_fields: additional/grafana/logs
transform:
  engine: elastic
  variant: filebeat.grafana_logs.default
catalogue:
  package: grafana
  data_stream: logs
  intakes: [beats]
  variants:
    - filebeat.grafana_logs.default
