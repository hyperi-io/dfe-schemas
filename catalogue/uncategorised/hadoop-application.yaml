# Catalogue source hadoop-application: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: hadoop-application
display_name: hadoop.application
description: The application data stream of the Elastic hadoop integration.
match:
  field: data_stream.dataset
  operator: equals
  value: hadoop.application
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/hadoop/application
  additional_fields: additional/hadoop/application
transform:
  engine: elastic
  variant: filebeat.hadoop_application.default
catalogue:
  package: hadoop
  data_stream: application
  intakes: [beats]
  variants:
    - filebeat.hadoop_application.default
