# Catalogue source hadoop-datanode: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: hadoop-datanode
display_name: hadoop.datanode
description: The datanode data stream of the Elastic hadoop integration.
match:
  field: data_stream.dataset
  operator: equals
  value: hadoop.datanode
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/hadoop/datanode
  additional_fields: additional/hadoop/datanode
transform:
  engine: elastic
  variant: filebeat.hadoop_datanode.default
catalogue:
  package: hadoop
  data_stream: datanode
  intakes: [beats]
  variants:
    - filebeat.hadoop_datanode.default
