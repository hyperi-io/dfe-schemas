# Catalogue source hashicorp-vault-metrics: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: hashicorp-vault-metrics
display_name: hashicorp_vault.metrics
description: The metrics data stream of the Elastic hashicorp_vault integration.
match:
  field: data_stream.dataset
  operator: equals
  value: hashicorp_vault.metrics
transform:
  engine: elastic
  variant: filebeat.hashicorp_vault_metrics.default
catalogue:
  package: hashicorp_vault
  data_stream: metrics
  intakes: [beats]
  variants:
    - filebeat.hashicorp_vault_metrics.default
