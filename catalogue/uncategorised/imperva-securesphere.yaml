# Catalogue source imperva-securesphere: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: imperva-securesphere
display_name: imperva.securesphere
description: The securesphere data stream of the Elastic imperva integration.
match:
  field: _source
  operator: equals
  value: imperva-securesphere
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/imperva/securesphere
  additional_fields: additional/imperva/securesphere
transform:
  engine: elastic
  variant: filebeat.imperva_securesphere.default
catalogue:
  package: imperva
  data_stream: securesphere
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.imperva_securesphere.default
