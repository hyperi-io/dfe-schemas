# Catalogue source jamf-protect-alerts: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: jamf-protect-alerts
display_name: jamf_protect.alerts
description: The alerts data stream of the Elastic jamf_protect integration.
match:
  field: _source
  operator: equals
  value: jamf-protect-alerts
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/jamf_protect/alerts
  additional_fields: additional/jamf_protect/alerts
transform:
  engine: elastic
  variant: filebeat.jamf_protect_alerts.default
catalogue:
  package: jamf_protect
  data_stream: alerts
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.jamf_protect_alerts.default
