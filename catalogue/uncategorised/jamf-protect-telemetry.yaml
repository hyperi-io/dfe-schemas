# Catalogue source jamf-protect-telemetry: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: jamf-protect-telemetry
display_name: jamf_protect.telemetry
description: The telemetry data stream of the Elastic jamf_protect integration.
match:
  field: _source
  operator: equals
  value: jamf-protect-telemetry
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/jamf_protect/telemetry
  additional_fields: additional/jamf_protect/telemetry
transform:
  engine: elastic
  variant: filebeat.jamf_protect_telemetry.default
catalogue:
  package: jamf_protect
  data_stream: telemetry
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.jamf_protect_telemetry.default
