# Catalogue source juniper-junos-log: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: juniper-junos-log
display_name: juniper_junos.log
description: The log data stream of the Elastic juniper_junos integration.
match:
  field: _source
  operator: equals
  value: juniper-junos-log
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/juniper_junos/log
  additional_fields: additional/juniper_junos/log
transform:
  engine: elastic
  variant: filebeat.juniper_junos_log.default
catalogue:
  package: juniper_junos
  data_stream: log
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.juniper_junos_log.default
  detect:
    order: 370
    markers:
      - priority: 40
        any:
          - " UI_"
          - " LOGIN_FAILED:"
          - " LOGIN_PAM_"
          - " LOGIN_INFORMATION"
          - " SSHD_"
          - " SNMP_TRAP_"
          - " RPD_"
          - " CHASSISD_"
          - " SNMPD_"
          - " NASD_"
          - " PWC_"
          - " SERVICED_"
          - " FSAD_"
          - " BOOTPD_"
          - " TFTPD_"
          - " RMOPD_"
          - " MIB2D_"
          - " ECCD_"
          - " DCD_"
          - " LIBJNX_"
          - " LIBSERVICED_"
          - " DFWD_"
        note: "Junos message-id families"
