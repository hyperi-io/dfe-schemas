# Catalogue source juniper-netscreen-log: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: juniper-netscreen-log
display_name: juniper_netscreen.log
description: The log data stream of the Elastic juniper_netscreen integration.
match:
  field: _source
  operator: equals
  value: juniper-netscreen-log
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/juniper_netscreen/log
  additional_fields: additional/juniper_netscreen/log
transform:
  engine: elastic
  variant: filebeat.juniper_netscreen_log.default
catalogue:
  package: juniper_netscreen
  data_stream: log
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.juniper_netscreen_log.default
