# Catalogue source kafka-controller: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: kafka-controller
display_name: kafka.controller
description: The controller data stream of the Elastic kafka integration.
match:
  field: data_stream.dataset
  operator: equals
  value: kafka.controller
transform:
  engine: elastic
  variant: filebeat.kafka_controller.default
catalogue:
  package: kafka
  data_stream: controller
  intakes: [beats]
  variants:
    - filebeat.kafka_controller.default
