# Catalogue source lastpass-detailed-shared-folder: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: lastpass-detailed-shared-folder
display_name: lastpass.detailed_shared_folder
description: The detailed_shared_folder data stream of the Elastic lastpass integration.
match:
  field: data_stream.dataset
  operator: equals
  value: lastpass.detailed_shared_folder
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/lastpass/detailed_shared_folder
  additional_fields: additional/lastpass/detailed_shared_folder
transform:
  engine: elastic
  variant: filebeat.lastpass_detailed_shared_folder.default
catalogue:
  package: lastpass
  data_stream: detailed_shared_folder
  intakes: [beats]
  variants:
    - filebeat.lastpass_detailed_shared_folder.default
