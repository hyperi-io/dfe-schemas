# Catalogue source lastpass-event-report: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: lastpass-event-report
display_name: lastpass.event_report
description: The event_report data stream of the Elastic lastpass integration.
match:
  field: data_stream.dataset
  operator: equals
  value: lastpass.event_report
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/lastpass/event_report
  additional_fields: additional/lastpass/event_report
transform:
  engine: elastic
  variant: filebeat.lastpass_event_report.default
catalogue:
  package: lastpass
  data_stream: event_report
  intakes: [beats]
  variants:
    - filebeat.lastpass_event_report.default
