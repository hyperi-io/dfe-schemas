  derived_schema: derived/mimecast/archive_search_logs
  additional_fields: additional/mimecast/archive_search_logs
transform:
  engine: elastic
  variant: filebeat.mimecast_archive_search_logs.default
catalogue:
  package: mimecast
  data_stream: archive_search_logs
  intakes: [beats]
  variants:
    - filebeat.mimecast_archive_search_logs.default
