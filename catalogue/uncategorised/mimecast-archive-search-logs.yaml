source: mimecast-archive-search-logs
display_name: mimecast.archive_search_logs
description: The archive_search_logs data stream of the Elastic mimecast integration.
match:
  field: data_stream.dataset
  operator: equals
  value: mimecast.archive_search_logs
schema:
