# Catalogue source nginx-access: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: nginx-access
display_name: nginx.access
description: The access data stream of the Elastic nginx integration.
match:
  field: data_stream.dataset
  operator: equals
  value: nginx.access
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/nginx/access
  additional_fields: additional/nginx/access
transform:
  engine: elastic
  variant: filebeat.nginx_access.default
catalogue:
  package: nginx
  data_stream: access
  intakes: [beats]
  variants:
    - filebeat.nginx_access.default
