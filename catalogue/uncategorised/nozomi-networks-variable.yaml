# Catalogue source nozomi-networks-variable: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: nozomi-networks-variable
display_name: nozomi_networks.variable
description: The variable data stream of the Elastic nozomi_networks integration.
match:
  field: data_stream.dataset
  operator: equals
  value: nozomi_networks.variable
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/nozomi_networks/variable
  additional_fields: additional/nozomi_networks/variable
transform:
  engine: elastic
  variant: filebeat.nozomi_networks_variable.default
catalogue:
  package: nozomi_networks
  data_stream: variable
  intakes: [beats]
  variants:
    - filebeat.nozomi_networks_variable.default
