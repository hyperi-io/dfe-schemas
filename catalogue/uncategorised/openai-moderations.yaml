# Catalogue source openai-moderations: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: openai-moderations
display_name: openai.moderations
description: The moderations data stream of the Elastic openai integration.
match:
  field: data_stream.dataset
  operator: equals
  value: openai.moderations
transform:
  engine: elastic
  variant: filebeat.openai_moderations.default
catalogue:
  package: openai
  data_stream: moderations
  intakes: [beats]
  variants:
    - filebeat.openai_moderations.default
