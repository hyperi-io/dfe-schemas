# Catalogue source opencanary-events: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: opencanary-events
display_name: opencanary.events
description: The events data stream of the Elastic opencanary integration.
match:
  field: _source
  operator: equals
  value: opencanary-events
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/opencanary/events
  additional_fields: additional/opencanary/events
transform:
  engine: elastic
  variant: filebeat.opencanary_events.default
catalogue:
  package: opencanary
  data_stream: events
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.opencanary_events.default
