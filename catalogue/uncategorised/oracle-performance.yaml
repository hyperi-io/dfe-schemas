# Catalogue source oracle-performance: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: oracle-performance
display_name: oracle.performance
description: The performance data stream of the Elastic oracle integration.
match:
  field: data_stream.dataset
  operator: equals
  value: oracle.performance
transform:
  engine: elastic
  variant: filebeat.oracle_performance.default
catalogue:
  package: oracle
  data_stream: performance
  intakes: [beats]
  variants:
    - filebeat.oracle_performance.default
