# Catalogue source osquery-manager-result: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: osquery-manager-result
display_name: osquery_manager.result
description: The result data stream of the Elastic osquery_manager integration.
match:
  field: data_stream.dataset
  operator: equals
  value: osquery_manager.result
transform:
  engine: elastic
  variant: filebeat.osquery_manager_result.default
catalogue:
  package: osquery_manager
  data_stream: result
  intakes: [beats]
  variants:
    - filebeat.osquery_manager_result.default
