# Catalogue source proxysg-log: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: proxysg-log
display_name: proxysg.log
description: The log data stream of the Elastic proxysg integration.
match:
  field: _source
  operator: equals
  value: proxysg-log
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/proxysg/log
  additional_fields: additional/proxysg/log
transform:
  engine: elastic
  variant: filebeat.proxysg_log.default
catalogue:
  package: proxysg
  data_stream: log
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.proxysg_log.default
  detect:
    order: 800
    markers:
      - priority: 35
        any: [" TCP_"]
        note: "access-log action, below squid whose slash form it shares"
      - priority: 45
        any: ["TUNNELED "]
        note: "CONNECT rows with no action"
