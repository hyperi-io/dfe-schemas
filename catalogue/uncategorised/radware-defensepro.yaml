# Catalogue source radware-defensepro: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: radware-defensepro
display_name: radware.defensepro
description: The defensepro data stream of the Elastic radware integration.
match:
  field: _source
  operator: equals
  value: radware-defensepro
transform:
  engine: elastic
  variant: filebeat.radware_defensepro.default
catalogue:
  package: radware
  data_stream: defensepro
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.radware_defensepro.default
  detect:
    order: 850
    markers:
      - priority: 55
        any: ["DefensePro: ", "%DefensePro "]
        note: "DefensePro tag in both header forms"
