# Catalogue source rubrik-sla-domains: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: rubrik-sla-domains
display_name: rubrik.sla_domains
description: The sla_domains data stream of the Elastic rubrik integration.
match:
