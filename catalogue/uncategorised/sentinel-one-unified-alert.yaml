# Catalogue source sentinel-one-unified-alert: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: sentinel-one-unified-alert
display_name: sentinel_one.unified_alert
description: The unified_alert data stream of the Elastic sentinel_one integration.
match:
  field: data_stream.dataset
  operator: equals
  value: sentinel_one.unified_alert
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/sentinel_one/unified_alert
  additional_fields: additional/sentinel_one/unified_alert
transform:
  engine: elastic
  variant: filebeat.sentinel_one_unified_alert.default
catalogue:
  package: sentinel_one
  data_stream: unified_alert
  intakes: [beats]
  variants:
    - filebeat.sentinel_one_unified_alert.default
