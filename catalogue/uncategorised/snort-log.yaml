# Catalogue source snort-log: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: snort-log
display_name: snort.log
description: The log data stream of the Elastic snort integration.
match:
  field: _source
  operator: equals
  value: snort-log
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/snort/log
  additional_fields: additional/snort/log
transform:
  engine: elastic
  variant: filebeat.snort_log.default
catalogue:
  package: snort
  data_stream: log
  intakes: [beats, receiver]
  framing: line
  variants:
    - filebeat.snort_log.default
  detect:
    order: 540
    markers:
      - priority: 40
        any: ["[**] ["]
        note: "alert_fast [**] [gid:sid:rev]"
      - priority: 40
        any: [" ,"]
        verify: snort_csv
        note: "alert_csv"
      - priority: 40
        all: ["{\"seconds\":", ",\"action\":\""]
        note: "alert_json leading fields"
      - priority: 40
        all: ["\"pkt_gen\"", "\"pkt_num\""]
        note: "alert_json key pair"
      - priority: 40
        any: [" snort: ["]
        note: "syslog form with the rule triple"
      - priority: 40
        all: ["snort[", "]: ["]
        note: "syslog form with a pid"
