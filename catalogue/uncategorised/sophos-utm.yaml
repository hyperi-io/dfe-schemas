# Catalogue source sophos-utm: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: sophos-utm
display_name: sophos.utm
description: The utm data stream of the Elastic sophos integration.
match:
  field: _source
  operator: equals
  value: sophos-utm
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/sophos/utm
  additional_fields: additional/sophos/utm
transform:
  engine: elastic
  variant: filebeat.sophos_utm.default
catalogue:
  package: sophos
  data_stream: utm
  intakes: [beats, receiver]
  framing: line
  variants:
    - filebeat.sophos_utm.default
  detect:
    order: 810
    markers:
      - priority: 50
        any:
          - "2018:"
          - "2019:"
          - "2020:"
          - "2021:"
          - "2022:"
          - "2023:"
          - "2024:"
          - "2025:"
          - "2026:"
          - "2027:"
          - "2028:"
          - "2029:"
          - "2030:"
        verify: utm_stamp
        note: "YYYY:MM:DD-HH:MM:SS stamp"
