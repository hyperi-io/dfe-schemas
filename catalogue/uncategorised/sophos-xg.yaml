# Catalogue source sophos-xg: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: sophos-xg
display_name: sophos.xg
description: The xg data stream of the Elastic sophos integration.
match:
  field: _source
  operator: equals
  value: sophos-xg
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/sophos/xg
  additional_fields: additional/sophos/xg
transform:
  engine: elastic
  variant: filebeat.sophos_xg.default
catalogue:
  package: sophos
  data_stream: xg
  intakes: [beats, receiver]
  framing: line
  variants:
    - filebeat.sophos_xg.default
  detect:
    order: 460
    markers:
      - priority: 50
        any: ["device=\"SFW\"", "device_name=\"SFW\""]
        note: "device=SFW (older and 18.5+)"
      - priority: 45
        all: ["log_type=\"", " log_component=\""]
        note: "log_type beside log_component"
