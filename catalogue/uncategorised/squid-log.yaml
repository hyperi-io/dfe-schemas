# Catalogue source squid-log: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: squid-log
display_name: squid.log
description: The log data stream of the Elastic squid integration.
match:
  field: _source
  operator: equals
  value: squid-log
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/squid/log
  additional_fields: additional/squid/log
transform:
  engine: elastic
  variant: filebeat.squid_log.default
catalogue:
  package: squid
  data_stream: log
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.squid_log.default
  detect:
    order: 530
    markers:
      - priority: 40
        any: ["TCP_", "UDP_", "NONE/", "TAG_NONE/"]
        verify: squid_status
        note: "TCP_MISS/200 style action and status, which ProxySG spells with a space"
