# Catalogue source swimlane-tenant-api: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: swimlane-tenant-api
display_name: swimlane.tenant_api
description: The tenant_api data stream of the Elastic swimlane integration.
match:
