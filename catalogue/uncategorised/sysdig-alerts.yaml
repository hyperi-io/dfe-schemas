# Catalogue source sysdig-alerts: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: sysdig-alerts
display_name: sysdig.alerts
description: The alerts data stream of the Elastic sysdig integration.
match:
  field: _source
  operator: equals
  value: sysdig-alerts
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/sysdig/alerts
  additional_fields: additional/sysdig/alerts
transform:
  engine: elastic
  variant: filebeat.sysdig_alerts.default
catalogue:
  package: sysdig
  data_stream: alerts
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.sysdig_alerts.default
