# Catalogue source tanium-action-history: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: tanium-action-history
display_name: tanium.action_history
description: The action_history data stream of the Elastic tanium integration.
match:
  field: _source
  operator: equals
  value: tanium-action-history
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/tanium/action_history
  additional_fields: additional/tanium/action_history
transform:
  engine: elastic
  variant: filebeat.tanium_action_history.default
catalogue:
  package: tanium
  data_stream: action_history
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.tanium_action_history.default
