# Catalogue source tanium-reporting: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: tanium-reporting
display_name: tanium.reporting
description: The reporting data stream of the Elastic tanium integration.
match:
  field: _source
  operator: equals
  value: tanium-reporting
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/tanium/reporting
  additional_fields: additional/tanium/reporting
transform:
  engine: elastic
  variant: filebeat.tanium_reporting.default
catalogue:
  package: tanium
  data_stream: reporting
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.tanium_reporting.default
