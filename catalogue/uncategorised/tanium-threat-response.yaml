# Catalogue source tanium-threat-response: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: tanium-threat-response
display_name: tanium.threat_response
description: The threat_response data stream of the Elastic tanium integration.
match:
  field: _source
  operator: equals
  value: tanium-threat-response
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/tanium/threat_response
  additional_fields: additional/tanium/threat_response
transform:
  engine: elastic
  variant: filebeat.tanium_threat_response.default
catalogue:
  package: tanium
  data_stream: threat_response
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.tanium_threat_response.default
  detect:
    order: 710
    markers:
      - priority: 50
        all: ["\"Alert Id\"", "\"Intel Id\"", "\"Intel Type\""]
      - priority: 50
        all: ["\"Event Id\"", "\"Event Name\"", "\"Computer IP\""]
      - priority: 50
        all: ["\"rowId\"", "\"revision\"", "\"userName\""]
