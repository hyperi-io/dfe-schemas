# Catalogue source thycotic-ss-logs: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: thycotic-ss-logs
display_name: thycotic_ss.logs
description: The logs data stream of the Elastic thycotic_ss integration.
match:
  field: _source
  operator: equals
  value: thycotic-ss-logs
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/thycotic_ss/logs
  additional_fields: additional/thycotic_ss/logs
transform:
  engine: elastic
  variant: filebeat.thycotic_ss_logs.default
catalogue:
  package: thycotic_ss
  data_stream: logs
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.thycotic_ss_logs.default
