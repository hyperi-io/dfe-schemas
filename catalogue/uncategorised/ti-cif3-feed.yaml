# Catalogue source ti-cif3-feed: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: ti-cif3-feed
display_name: ti_cif3.feed
description: The feed data stream of the Elastic ti_cif3 integration.
match:
  field: data_stream.dataset
  operator: equals
  value: ti_cif3.feed
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/ti_cif3/feed
  additional_fields: additional/ti_cif3/feed
transform:
  engine: elastic
  variant: filebeat.ti_cif3_feed.default
catalogue:
  package: ti_cif3
  data_stream: feed
  intakes: [beats]
  variants:
    - filebeat.ti_cif3_feed.default
