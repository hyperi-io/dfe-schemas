# Catalogue source ti-eset-botnet: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: ti-eset-botnet
display_name: ti_eset.botnet
description: The botnet data stream of the Elastic ti_eset integration.
match:
  field: data_stream.dataset
  operator: equals
  value: ti_eset.botnet
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/ti_eset/botnet
  additional_fields: additional/ti_eset/botnet
transform:
  engine: elastic
  variant: filebeat.ti_eset_botnet.default
catalogue:
  package: ti_eset
  data_stream: botnet
  intakes: [beats]
  variants:
    - filebeat.ti_eset_botnet.default
