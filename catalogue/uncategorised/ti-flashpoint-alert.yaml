# Catalogue source ti-flashpoint-alert: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: ti-flashpoint-alert
display_name: ti_flashpoint.alert
description: The alert data stream of the Elastic ti_flashpoint integration.
match:
  field: data_stream.dataset
  operator: equals
  value: ti_flashpoint.alert
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/ti_flashpoint/alert
  additional_fields: additional/ti_flashpoint/alert
transform:
  engine: elastic
  variant: filebeat.ti_flashpoint_alert.default
catalogue:
  package: ti_flashpoint
  data_stream: alert
  intakes: [beats]
  variants:
    - filebeat.ti_flashpoint_alert.default
