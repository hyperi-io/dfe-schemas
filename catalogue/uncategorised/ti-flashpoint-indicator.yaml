# Catalogue source ti-flashpoint-indicator: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: ti-flashpoint-indicator
display_name: ti_flashpoint.indicator
description: The indicator data stream of the Elastic ti_flashpoint integration.
match:
  field: data_stream.dataset
  operator: equals
  value: ti_flashpoint.indicator
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/ti_flashpoint/indicator
  additional_fields: additional/ti_flashpoint/indicator
transform:
  engine: elastic
  variant: filebeat.ti_flashpoint_indicator.default
catalogue:
  package: ti_flashpoint
  data_stream: indicator
  intakes: [beats]
  variants:
    - filebeat.ti_flashpoint_indicator.default
