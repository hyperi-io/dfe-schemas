# Catalogue source ti-maltiverse-indicator: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: ti-maltiverse-indicator
display_name: ti_maltiverse.indicator
description: The indicator data stream of the Elastic ti_maltiverse integration.
match:
  field: data_stream.dataset
  operator: equals
  value: ti_maltiverse.indicator
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/ti_maltiverse/indicator
  additional_fields: additional/ti_maltiverse/indicator
transform:
  engine: elastic
  variant: filebeat.ti_maltiverse_indicator.default
catalogue:
  package: ti_maltiverse
  data_stream: indicator
  intakes: [beats]
  variants:
    - filebeat.ti_maltiverse_indicator.default
