# Catalogue source ti-opencti-indicator: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: ti-opencti-indicator
display_name: ti_opencti.indicator
description: The indicator data stream of the Elastic ti_opencti integration.
match:
  field: data_stream.dataset
  operator: equals
  value: ti_opencti.indicator
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/ti_opencti/indicator
  additional_fields: additional/ti_opencti/indicator
transform:
  engine: elastic
  variant: filebeat.ti_opencti_indicator.default
catalogue:
  package: ti_opencti
  data_stream: indicator
  intakes: [beats]
  variants:
    - filebeat.ti_opencti_indicator.default
