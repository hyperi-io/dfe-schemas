# Catalogue source tychon-stig: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: tychon-stig
display_name: tychon.stig
description: The stig data stream of the Elastic tychon integration.
match:
  field: data_stream.dataset
  operator: equals
  value: tychon.stig
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/tychon/stig
  additional_fields: additional/tychon/stig
transform:
  engine: elastic
  variant: filebeat.tychon_stig.default
catalogue:
  package: tychon
  data_stream: stig
  intakes: [beats]
  variants:
    - filebeat.tychon_stig.default
