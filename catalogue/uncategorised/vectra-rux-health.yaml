# Catalogue source vectra-rux-health: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: vectra-rux-health
display_name: vectra_rux.health
description: The health data stream of the Elastic vectra_rux integration.
match:
  field: data_stream.dataset
  operator: equals
  value: vectra_rux.health
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/vectra_rux/health
  additional_fields: additional/vectra_rux/health
transform:
  engine: elastic
  variant: filebeat.vectra_rux_health.default
catalogue:
  package: vectra_rux
  data_stream: health
  intakes: [beats]
  variants:
    - filebeat.vectra_rux_health.default
