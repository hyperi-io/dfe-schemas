# Catalogue source zeek-files: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: zeek-files
display_name: zeek.files
description: The files data stream of the Elastic zeek integration.
match:
  field: data_stream.dataset
  operator: equals
  value: zeek.files
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/zeek/files
  additional_fields: additional/zeek/files
transform:
  engine: elastic
  variant: filebeat.zeek_files.default
catalogue:
  package: zeek
  data_stream: files
  intakes: [beats]
  variants:
    - filebeat.zeek_files.default
