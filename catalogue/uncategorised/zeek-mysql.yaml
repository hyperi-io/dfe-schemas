# Catalogue source zeek-mysql: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: zeek-mysql
display_name: zeek.mysql
description: The mysql data stream of the Elastic zeek integration.
match:
  field: data_stream.dataset
  operator: equals
  value: zeek.mysql
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/zeek/mysql
  additional_fields: additional/zeek/mysql
transform:
  engine: elastic
  variant: filebeat.zeek_mysql.default
catalogue:
  package: zeek
  data_stream: mysql
  intakes: [beats]
  variants:
    - filebeat.zeek_mysql.default
