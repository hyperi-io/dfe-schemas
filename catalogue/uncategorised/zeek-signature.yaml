# Catalogue source zeek-signature: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: zeek-signature
display_name: zeek.signature
description: The signature data stream of the Elastic zeek integration.
match:
  field: data_stream.dataset
  operator: equals
  value: zeek.signature
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/zeek/signature
  additional_fields: additional/zeek/signature
transform:
  engine: elastic
  variant: filebeat.zeek_signature.default
catalogue:
  package: zeek
  data_stream: signature
  intakes: [beats]
  variants:
    - filebeat.zeek_signature.default
