# Catalogue source zeek-software: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: zeek-software
display_name: zeek.software
description: The software data stream of the Elastic zeek integration.
match:
  field: data_stream.dataset
  operator: equals
  value: zeek.software
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/zeek/software
  additional_fields: additional/zeek/software
transform:
  engine: elastic
  variant: filebeat.zeek_software.default
catalogue:
  package: zeek
  data_stream: software
  intakes: [beats]
  variants:
    - filebeat.zeek_software.default
