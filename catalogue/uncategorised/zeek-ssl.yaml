# Catalogue source zeek-ssl: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: zeek-ssl
display_name: zeek.ssl
description: The ssl data stream of the Elastic zeek integration.
match:
  field: data_stream.dataset
  operator: equals
  value: zeek.ssl
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/zeek/ssl
  additional_fields: additional/zeek/ssl
transform:
  engine: elastic
  variant: filebeat.zeek_ssl.default
catalogue:
  package: zeek
  data_stream: ssl
  intakes: [beats]
  variants:
    - filebeat.zeek_ssl.default
