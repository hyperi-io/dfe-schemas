# Catalogue source zoom-webhook: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: zoom-webhook
display_name: zoom.webhook
description: The webhook data stream of the Elastic zoom integration.
match:
  field: _source
  operator: equals
  value: zoom-webhook
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/zoom/webhook
  additional_fields: additional/zoom/webhook
transform:
  engine: elastic
  variant: filebeat.zoom_webhook.default
catalogue:
  package: zoom
  data_stream: webhook
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.zoom_webhook.default
