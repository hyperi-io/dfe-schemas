# Catalogue source varonis-logs: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: varonis-logs
display_name: varonis.logs
description: The logs data stream of the Elastic varonis integration.
match:
  field: _source
  operator: equals
  value: varonis-logs
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/varonis/logs
  additional_fields: additional/varonis/logs
transform:
  engine: elastic
  variant: filebeat.varonis_logs.default
catalogue:
  package: varonis
  data_stream: logs
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.varonis_logs.default
