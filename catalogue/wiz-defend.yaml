# Catalogue source wiz-defend: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: wiz-defend
display_name: wiz.defend
description: The defend data stream of the Elastic wiz integration.
match:
  field: _source
  operator: equals
  value: wiz-defend
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/wiz/defend
  additional_fields: additional/wiz/defend
transform:
  engine: elastic
  variant: filebeat.wiz_defend.default
catalogue:
  package: wiz
  data_stream: defend
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.wiz_defend.default
