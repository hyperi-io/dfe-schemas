# Catalogue source xm-cyber-risk-score: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: xm-cyber-risk-score
display_name: xm_cyber.risk_score
description: The risk_score data stream of the Elastic xm_cyber integration.
match:
  field: data_stream.dataset
  operator: equals
  value: xm_cyber.risk_score
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/xm_cyber/risk_score
  additional_fields: additional/xm_cyber/risk_score
transform:
  engine: elastic
  variant: filebeat.xm_cyber_risk_score.default
catalogue:
  package: xm_cyber
  data_stream: risk_score
  intakes: [beats]
  variants:
    - filebeat.xm_cyber_risk_score.default
