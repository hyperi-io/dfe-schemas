# Catalogue source zeek-connection: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: zeek-connection
display_name: zeek.connection
description: The connection data stream of the Elastic zeek integration.
match:
  field: data_stream.dataset
  operator: equals
  value: zeek.connection
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/zeek/connection
  additional_fields: additional/zeek/connection
transform:
  engine: elastic
  variant: filebeat.zeek_connection.default
catalogue:
  package: zeek
  data_stream: connection
  intakes: [beats]
  variants:
    - filebeat.zeek_connection.default
