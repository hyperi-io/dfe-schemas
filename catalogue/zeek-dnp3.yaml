# Catalogue source zeek-dnp3: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: zeek-dnp3
display_name: zeek.dnp3
description: The dnp3 data stream of the Elastic zeek integration.
match:
  field: data_stream.dataset
  operator: equals
  value: zeek.dnp3
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/zeek/dnp3
  additional_fields: additional/zeek/dnp3
transform:
  engine: elastic
  variant: filebeat.zeek_dnp3.default
catalogue:
  package: zeek
  data_stream: dnp3
  intakes: [beats]
  variants:
    - filebeat.zeek_dnp3.default
