# Catalogue source zeek-socks: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: zeek-socks
display_name: zeek.socks
description: The socks data stream of the Elastic zeek integration.
match:
  field: data_stream.dataset
  operator: equals
  value: zeek.socks
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/zeek/socks
  additional_fields: additional/zeek/socks
transform:
  engine: elastic
  variant: filebeat.zeek_socks.default
catalogue:
  package: zeek
  data_stream: socks
  intakes: [beats]
  variants:
    - filebeat.zeek_socks.default
