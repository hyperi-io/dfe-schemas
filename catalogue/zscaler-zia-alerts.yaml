# Catalogue source zscaler-zia-alerts: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: zscaler-zia-alerts
display_name: zscaler_zia.alerts
description: The alerts data stream of the Elastic zscaler_zia integration.
match:
  field: _source
  operator: equals
  value: zscaler-zia-alerts
schema:
  meta_schema: meta/elastic/ecs
  derived_schema: derived/zscaler_zia/alerts
  additional_fields: additional/zscaler_zia/alerts
transform:
  engine: elastic
  variant: filebeat.zscaler_zia_alerts.default
catalogue:
  package: zscaler_zia
  data_stream: alerts
  intakes: [beats, receiver]
  framing: body
  variants:
    - filebeat.zscaler_zia_alerts.default
