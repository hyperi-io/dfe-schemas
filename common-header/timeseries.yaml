        comment: "Data source label (e.g. beats, syslog, crowdstrike-edr)"
        _field_type: base

      - name: _raw
        type: text
        use_case: substring_search
        index: "text(tokenizer = 'splitByNonAlpha') GRANULARITY 64"
        expr: "@captured: raw_payload"
        comment: "Original event payload as text (full-text indexed)"
        _field_type: base

      - name: _json
        type: json
