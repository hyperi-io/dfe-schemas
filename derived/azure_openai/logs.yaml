base: meta/elastic/ecs
base_version: "1.0.0"
current: "1.0.0"
versions:
  "1.0.0":
    date: "2026-10-04"
    summary: azure_openai.logs selection from meta/elastic/ecs
    select:
    - name: cloud_account_id
      index: exact_match
    - name: cloud_provider
      index: exact_match
    - name: data_stream_dataset
      index: exact_match
    - name: data_stream_namespace
      index: exact_match
    - name: data_stream_type
      index: exact_match
    - name: event_duration
      index: range
    - name: event_original
      index: none
    - name: event_outcome
      index: exact_match
    - name: http_request_method
      index: exact_match
    - name: http_response_status_code
      index: range
    - name: log_level
      index: exact_match
    - name: source_ip
      index: dimension
    - name: tags
      index: exact_match
    - name: url_domain
      index: exact_match
    - name: url_original
      index: exact_match
    - name: url_path
      index: exact_match
    - name: url_query
      index: exact_match
    - name: url_scheme
      index: exact_match
