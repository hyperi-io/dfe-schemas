base: meta/elastic/ecs
base_version: "1.0.0"
current: "1.0.0"
versions:
  "1.0.0":
    date: "2026-10-04"
    summary: tetragon.log selection from meta/elastic/ecs
    select:
    - name: container_id
      index: exact_match
    - name: container_image_name
      index: exact_match
    - name: container_labels
      index: key_search
    - name: container_name
      index: exact_match
    - name: data_stream_dataset
      index: exact_match
    - name: data_stream_namespace
      index: exact_match
    - name: data_stream_type
      index: exact_match
    - name: ecs_version
      index: exact_match
    - name: event_action
      index: exact_match
    - name: event_dataset
      index: exact_match
    - name: event_module
      index: exact_match
    - name: event_original
      index: none
    - name: host_name
      index: exact_match
    - name: message
      index: word_search
    - name: orchestrator_namespace
      index: exact_match
    - name: orchestrator_resource_name
      index: exact_match
    - name: orchestrator_resource_parent_type
      index: exact_match
    - name: process_args
      index: exact_match
    - name: process_entity_id
      index: exact_match
    - name: process_executable
      index: exact_match
    - name: process_exit_code
      index: range
    - name: process_parent_args
      index: exact_match
    - name: process_parent_entity_id
      index: exact_match
    - name: process_parent_executable
      index: exact_match
    - name: process_parent_pid
      index: range
    - name: process_parent_start
      index: range
    - name: process_parent_thread_id
      index: range
    - name: process_parent_user_id
      index: exact_match
    - name: process_parent_working_directory
      index: exact_match
    - name: process_pid
      index: range
    - name: process_start
      index: range
    - name: process_thread_id
      index: range
    - name: process_user_id
      index: exact_match
    - name: process_working_directory
      index: exact_match
    - name: tags
      index: exact_match
