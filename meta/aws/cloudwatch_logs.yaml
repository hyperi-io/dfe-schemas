        comment: "CloudWatch log group name"
        _field_type: base

      - name: log_stream_name
        type: string
        use_case: dimension
        expr: "@source: logStreamName"
        comment: "CloudWatch log stream name"
        _field_type: base

      - name: timestamp
        type: datetime
        use_case: range
        expr: "@source: timestamp"
        comment: "Event timestamp (epoch milliseconds)"
        _field_type: base

      - name: ingestion_time
        type: datetime
        attribute: [nullable]
        use_case: range
        expr: "@source: ingestionTime"
        comment: "When CloudWatch ingested the event"
        _field_type: base

      - name: message
        type: text
        use_case: word_search
        expr: "@source: message"
        comment: "Log event message content"
        _field_type: base

  "1.1.0":
    date: "2026-10-31"
    type: addition
    summary: "Add aws_account_id and aws_region, which dfe-fetcher stamps on each event"
    columns:
      - name: event_id
        type: string
