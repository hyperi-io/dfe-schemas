# Meta schema: Elastic Auditbeat
#
# The three modules the shipped auditbeat.yml enables: auditd,
# file_integrity, and the system module's host, login, package, process,
# socket and user datasets. Field names, types and descriptions read from
# Elastic's own field declarations at elastic/beats tag v9.5.4 (released
# 2026-09-15): auditbeat/_meta/fields.common.yml, the auditd and
# file_integrity module fields.yml, and x-pack/auditbeat/module/system.
# Checked against the auditd testdata goldens and the modules' data.json
# events, which is where system.audit.host.ip and .mac turned out to be
# lists.
#
# auditd.data holds every key Elastic declares for an audit record, one
# column each; a record fills only the keys its type carries.
#
# Left out, and still in the common header's `_json` column: the alias
# fields, which repeat an ECS path the spine carries (user.auid is
# user.audit.id); arrays of objects, which have no flat column -- auditd.paths,
# system.audit.user.group, and the import lists and section tables of
# file.elf, file.macho and file.pe; and the top-level geoip group, which
# Elastic declares only as a convenience for a Logstash or ingest-pipeline
# lookup and Auditbeat itself never sends.
#
# The ECS-spine columns are copied from meta/elastic/ecs.yaml unchanged --
# same name, type, ch_override, codec, cardinality, use_case, expr and
# comment -- so the two vocabularies cannot disagree about a field they share.
# That file carries only the ECS fields the Elastic integrations reference,
# so process.hash.sha512, and host.containerized from add_host_metadata, are
# built from libbeat's own declarations at the same tag by the same type
# rules.
#
# Column names are the dotted source path with dots and hyphens replaced by
# underscores and folded to lower case. `expr` carries the path in the case
# the shipper actually sends, because dfe-loader reads that directive back out
# of the ClickHouse column comment to find the field.

