# Meta schema: Elastic Heartbeat
#
# Heartbeat's uptime checks: the monitor, summary and state namespaces every
# check writes, the round-trip timings of the http, tcp, icmp and browser
# monitors, and the certificate fields a check of a TLS endpoint carries.
# Field names, types and descriptions read from Elastic's own field
# declarations at elastic/beats tag v9.5.4 (released 2026-09-15):
# heartbeat/_meta/fields.common.yml. Heartbeat ships no golden events, so
# shapes were read from the code that writes them. monitor.timespan is a
# {gte, lt} pair (heartbeat/monitors/wrappers/wrappers.go) and becomes two
# datetime columns.
#
# Heartbeat sends three ECS list fields as single strings: event.type, one
# value, heartbeat/summary (heartbeat/monitors/wrappers/summarizer/
# plugstatestat.go), and the certificate issuer and subject common names
# (heartbeat/monitors/active/dialchain/tlsmeta/tlsmeta.go). Their columns
# keep the ECS list type, so the same field has one type in every Beats
# table; landing a single value in them takes a loader that wraps it into a
# one-element list.
#
# Left out, and still in the common header's `_json` column: the alias
# fields, which repeat an ECS path the spine carries (monitor.host is
# url.domain); the two fields Elastic itself does not index,
# synthetics.payload and http.response.headers; synthetics.blob, the binary
# screenshot payload; the screenshot block list, an array of objects; and
# tls.certificate_not_valid_before and _after, deprecated since 7.8 in favour
# of tls.server.x509.not_before and not_after, which are here.
# observer.geo.location is out too: only an optional geo setting fills it,
# and observer.geo.name carries that location's name. So are the rest of
# host.*, cloud.* and container.*: the shipped heartbeat.yml runs
# add_observer_metadata, not add_host_metadata, add_cloud_metadata or
# add_docker_metadata.
#
# The ECS-spine columns are copied from meta/elastic/ecs.yaml unchanged --
# same name, type, ch_override, codec, cardinality, use_case, expr and
# comment -- so the two vocabularies cannot disagree about a field they share.
# That file carries only the ECS fields the Elastic integrations reference,
# so tls.next_protocol, tls.server.x509.signature_algorithm,
# public_key_exponent and public_key_curve are built from libbeat's own
# declarations at the same tag by the same type rules.
#
# Column names are the dotted source path with dots and hyphens replaced by
# underscores and folded to lower case. `expr` carries the path in the case
# the shipper actually sends, because dfe-loader reads that directive back out
# of the ClickHouse column comment to find the field.

current: "1.0.0"
resource_type: core

versions:
  "1.0.0":
    date: "2026-10-04"
    type: model
    summary: "Heartbeat 9.5 monitor, summary and state fields for the http, tcp, icmp and browser monitors, plus the ECS spine"
