        use_case: exact_match
        expr: '@source: state.status'
        comment: 'The current status, "up", "down", or "flapping" any state can change into flapping. Elasticsearch mapping type: keyword'
        _field_type: base

      - name: state_checks
        type: integer
        cardinality: unknown
        use_case: range
        expr: '@source: state.checks'
        comment: 'Total checks run. Elasticsearch mapping type: integer'
        _field_type: base

      - name: state_up
        type: integer
        cardinality: unknown
        use_case: range
        expr: '@source: state.up'
        comment: 'Total up checks run. Elasticsearch mapping type: integer'
        _field_type: base

      - name: state_down
