      - name: event_type
        type: string
        ch_override: Array(String)
        codec: ZSTD(1)
        cardinality: unknown
        use_case: exact_match
        expr: '@source: event.type'
        comment: 'Elasticsearch mapping type: keyword (normalize: array)'
        _field_type: base

      - name: service_name
        type: string
        cardinality: unknown
        use_case: exact_match
        expr: '@source: service.name'
        comment: 'Elasticsearch mapping type: keyword'
        _field_type: base

