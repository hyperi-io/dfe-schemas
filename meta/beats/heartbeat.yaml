        cardinality: unknown
        use_case: range
        expr: '@source: state.down'
        comment: 'Total down checks run. Elasticsearch mapping type: integer'
        _field_type: base

      - name: state_ends_id
        type: string
        cardinality: unknown
        use_case: exact_match
