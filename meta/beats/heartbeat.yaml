      - name: state_ends_status
        type: string
        cardinality: unknown
        use_case: exact_match
        expr: '@source: state.ends.status'
        comment: 'The current status, "up", "down", or "flapping" any state can change into flapping. Elasticsearch mapping type: keyword'
        _field_type: base

      - name: state_ends_checks
        type: integer
        cardinality: unknown
        use_case: range
