        _field_type: base

      - name: data_stream_type
        type: string
        cardinality: unknown
        use_case: exact_match
        expr: '@source: data_stream.type'
        comment: 'Elasticsearch mapping type: constant_keyword'
        _field_type: base

      - name: ecs_version
        type: string
        cardinality: unknown
        use_case: exact_match
        expr: '@source: ecs.version'
        comment: 'Elasticsearch mapping type: keyword'
        _field_type: base

      - name: event_module
        type: string
        cardinality: unknown
        use_case: exact_match
        expr: '@source: event.module'
        comment: 'Elasticsearch mapping type: keyword'
        _field_type: base

      - name: event_dataset
        type: string
        cardinality: unknown
        use_case: exact_match
        expr: '@source: event.dataset'
        comment: 'Elasticsearch mapping type: keyword'
        _field_type: base

      - name: event_kind
        type: string
        cardinality: unknown
        use_case: exact_match
