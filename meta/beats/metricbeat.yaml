# Meta schema: Elastic Metricbeat
#
# Metricbeat's system module as the shipped modules.d/system.yml enables it --
# the cpu, load, memory, network, process, process_summary, socket_summary,
# filesystem, fsstat and uptime metricsets -- plus the metricset envelope
# every module writes. Field names, types and descriptions read from
# Elastic's own field declarations at elastic/beats tag v9.5.4 (released
# 2026-09-15): metricbeat/_meta/fields.common.yml and the system module's
# _meta/fields.yml files. Shapes checked against the metricsets' data.json
# sample events in the same tree.
#
# Only the system module is here. Metricbeat ships 66 modules, each with its
# own namespace, and a deployment runs the few it needs; a module's namespace
# belongs in an additional/ overlay on this file rather than in every
# Metricbeat table. The metricsets the shipped config leaves commented out
# (core, diskio, entropy, socket, service, users, raid, ntp, network_summary)
# land in the common header's `_json` column and stay queryable there.
#
# Also left to `_json`: Elastic's alias fields, which repeat an ECS path the
# spine already carries (system.process.pid is process.pid), and the wildcard
# groups under system.process.cgroup.memory.stats and
# system.process.cgroup.io.stats, whose named members are columns below.
#
# The ECS-spine columns are copied from meta/elastic/ecs.yaml unchanged --
# same name, type, ch_override, codec, cardinality, use_case, expr and
# comment -- so the two vocabularies cannot disagree about a field they share.
# That file carries only the ECS fields the Elastic integrations reference,
# so process.pgid is built from libbeat's own declaration at the same tag by
# the same type rules, as are host.containerized and the kubernetes.* fields,
# which the add_host_metadata and add_kubernetes_metadata processors declare.
#
# Column names are the dotted source path with dots and hyphens replaced by
# underscores and folded to lower case. `expr` carries the path in the case
# the shipper actually sends, because dfe-loader reads that directive back out
# of the ClickHouse column comment to find the field.

