# Meta schema: Elastic Packetbeat
#
# Packetbeat's flow records and the transactions of the 15 protocols the
# shipped packetbeat.yml enables: amqp, cassandra, dhcpv4, dns, http, icmp,
# memcache, mongodb, mysql, nfs, pgsql, redis, sip, thrift and tls. Field
# names, types and descriptions read from Elastic's own field declarations
# at elastic/beats tag v9.5.4 (released 2026-09-15):
# packetbeat/_meta/fields.common.yml and packetbeat/protos/*/_meta/fields.yml.
# Arrays were read off the golden events in packetbeat/tests/system/golden,
# which is where sip.allow and the tls.detailed client_hello lists turned out
# to be lists. The field declarations do not say.
#
# The same goldens show Packetbeat sending the certificate issuer and subject
# names (tls.server.x509.issuer.* and .subject.*) as single strings where
# ECS declares lists. Those columns keep the ECS list type, so the same field
# has one type in every Beats table; landing a single value in them takes a
# loader that wraps it into a one-element list.
#
# Most of a Packetbeat event is ECS: source, destination, client, server,
# network, dns, http, url and tls. Those columns form the spine; the protocol
# namespaces Packetbeat adds on top sit beside the ECS block they extend.
#
# Left out, and still in the common header's `_json` column: the alias
# fields, which repeat an ECS path the spine carries (bytes_in is
# source.bytes); arrays of objects, which have no flat column -- dns.answers,
# dns.authorities, dns.additionals, memcache.response.stats and both
# tls.detailed certificate chains; and the geo fields. Packetbeat does no
# GeoIP lookup of its own, so source.geo and destination.geo arrive only from
# an enrichment step, and belong to that step's overlay.
#
# The ECS-spine columns are copied from meta/elastic/ecs.yaml unchanged --
# same name, type, ch_override, codec, cardinality, use_case, expr and
# comment -- so the two vocabularies cannot disagree about a field they share.
# That file carries only the ECS fields the Elastic integrations reference,
# so tls.next_protocol, tls.client.hash.sha1, tls.server.hash.md5,
# tls.server.x509.signature_algorithm, and host.containerized from
# add_host_metadata, are built from libbeat's own declarations at the same
# tag by the same type rules.
#
# Column names are the dotted source path with dots and hyphens replaced by
# underscores and folded to lower case. `expr` carries the path in the case
# the shipper actually sends, because dfe-loader reads that directive back out
# of the ClickHouse column comment to find the field.

