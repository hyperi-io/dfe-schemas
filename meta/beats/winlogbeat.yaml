# Meta schema: Elastic Winlogbeat
#
# The Windows Event Log vocabulary as Winlogbeat ships it: Elastic's
# `winlog.*` namespace, the `powershell.*` module namespace, and the ECS
# spine the Winlogbeat modules normalise into. Field names, types and
# descriptions read from Elastic's own field declarations at elastic/beats
# tag v9.5.4 (released 2026-09-15) -- `winlogbeat/_meta/fields.common.yml`
# for `winlog.*`, plus the security and powershell module field references.
#
# `winlog.*` sits OUTSIDE core ECS, so meta/elastic/ecs.yaml cannot be the
# base for a Windows hunt: its 1,018 columns carry no winlog field at all.
# The ECS-spine columns below are copied from that file unchanged -- same
# name, type, ch_override, codec, cardinality, use_case, expr and comment --
# so the two vocabularies cannot disagree about a field they share.
#
# Two collection realities this file holds at once. Winlogbeat's collection
# stage emits `winlog.*` and the raw `winlog.event_data.*` map and nothing
# else; the module ingest pipelines are what populate `process.*`, `file.*`,
# `registry.*` and the rest of the ECS spine. A deployment reading channels
# without a module pipeline has only the winlog columns, which is why they
# are first-class here rather than left to the common header's `_json`.
#
# Column names are the dotted source path with dots replaced by underscores
# and folded to lower case. `expr` carries the path in the case the shipper
# actually sends, because dfe-loader reads that directive back out of the
# ClickHouse column comment to find the field.
#
# `winlog.event_data` is an open map keyed per provider and per event, so it
# cannot be enumerated. The subfields below are the ones Windows hunts key on
# and that Elastic pre-declares; every other event_data key lands in the
# common header's `_json` column and stays queryable there.

current: "1.0.0"
resource_type: core

versions:
  "1.0.0":
    date: "2026-09-23"
    type: model
    summary: "Winlogbeat 9.5 winlog.* and powershell.* namespaces, plus the ECS spine the modules populate"
