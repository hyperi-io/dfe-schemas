# Meta schema: GCP VPC Flow Logs
#
# Cloud Logging entries under `log_id("compute.googleapis.com/vpc_flows")`, one
# row per element of `entries:list` `entries`, as dfe-fetcher's `gcp` profile
# lands it (unit `vpc_flow_logs`). The columns are the fields dfe-fetcher's own
# fixture for the unit asserts (crates/fetcher/tests/integration/source_gcp.rs);
# widen this schema only with a field that fixture lands.

current: "1.0.0"
resource_type: core

versions:
  "1.0.0":
    date: "2026-10-04"
    type: model
    summary: "Initial VPC Flow Logs schema"
    columns:
      - name: log_name
        type: string
        use_case: dimension
        expr: "@source: logName"
        comment: "Full log name of the entry"
        _field_type: base

      - name: severity
        type: string
        use_case: dimension
        expr: "@source: severity"
        comment: "Log entry severity"
        _field_type: base

      - name: insert_id
        type: string
        use_case: exact_match
        expr: "@source: insertId"
        comment: "Unique log entry identifier"
        _field_type: base
