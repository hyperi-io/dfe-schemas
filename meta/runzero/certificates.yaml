        _field_type: base

      - name: fp_sha256
        type: string
        use_case: dimension
        expr: "@source: record.fp_sha256"
        _field_type: base

      - name: hidden
        type: boolean
        use_case: dimension
        expr: "@source: record.hidden"
        _field_type: base

      - name: is_ca
        type: boolean
        use_case: dimension
        expr: "@source: record.is_ca"
