# Meta schema: runZero certificates
#
# Certificates: one row per TLS certificate seen on a service, with issuer and subject attributes, fingerprints and validity.
#
# Columns are the union of keys across the rows of a live export, typed from
# the values observed; the record sits under `record`, which is where every
# expression reads from. Generated by scripts/generate_meta_schemas.py: a
# changed export becomes a new version entry, never an edit of a published one.

current: "1.0.0"
resource_type: core

versions:
  "1.0.0":
    date: "2026-09-13"
    type: model
    summary: "Initial runZero certificates schema, from a live export"
    columns:
      - name: id
        type: uuid
        use_case: bloom
        expr: "@source: record.id"
        comment: "Row key of the export"
        _field_type: base

      - name: authority_key_id
        type: string
        attribute: [lowcardinality, nullable]
        use_case: dimension
        expr: "@source: record.authority_key_id"
        _field_type: base

      - name: cn
        type: string
        use_case: dimension
        expr: "@source: record.cn"
        _field_type: base

      - name: country
        type: string
        attribute: [lowcardinality, nullable]
        use_case: dimension
        expr: "@source: record.country"
        _field_type: base

      - name: created_at
        type: integer
        use_case: range
        expr: "@source: record.created_at"
        comment: "Unix epoch seconds as exported"
        _field_type: base

      - name: crl_distribution_points
        type: string
        ch_override: "Array(String)"
        expr: "@source: record.crl_distribution_points"
        comment: "List of strings; [] when absent"
        codec: "ZSTD(1)"
        _field_type: base

      - name: ext_key_usage
        type: string
        ch_override: "Array(String)"
        expr: "@source: record.ext_key_usage"
        comment: "List of strings; [] when absent"
        codec: "ZSTD(1)"
