# Meta schema: runZero findings
#
# Findings: one row per finding code raised against the organisation; there is no id, finding_code identifies the row.
#
# Columns are the union of keys across the rows of a live export, typed from
# the values observed; the record sits under `record`, which is where every
# expression reads from. Generated by scripts/generate_meta_schemas.py: a
# changed export becomes a new version entry, never an edit of a published one.

current: "1.0.0"
resource_type: core

versions:
  "1.0.0":
    date: "2026-09-13"
    type: model
    summary: "Initial runZero findings schema, from a live export"
    columns:
      - name: finding_code
        type: string
        use_case: exact_match
        expr: "@source: record.finding_code"
        comment: "Row key of the export"
        _field_type: base

      - name: category
        type: string
        use_case: dimension
        expr: "@source: record.category"
        _field_type: base

      - name: created_at
        type: integer
        use_case: range
        expr: "@source: record.created_at"
        comment: "Unix epoch seconds as exported"
        _field_type: base

      - name: description
        type: text
        expr: "@source: record.description"
        _field_type: base

      - name: instance_count
        type: integer
        use_case: range
        expr: "@source: record.instance_count"
        _field_type: base

      - name: last_detected_at
        type: integer
        use_case: range
        expr: "@source: record.last_detected_at"
        comment: "Unix epoch seconds as exported"
        _field_type: base

      - name: links
        type: json
        attribute: [not_null]
        expr: "@source: record.links"
        comment: "{} when absent"
        _field_type: base

      - name: name
        type: string
        use_case: dimension
        expr: "@source: record.name"
        _field_type: base

      - name: org_name
        type: string
        attribute: [lowcardinality]
        use_case: dimension
        expr: "@source: record.org_name"
        _field_type: base

      - name: organization_id
        type: uuid
        use_case: dimension
        expr: "@source: record.organization_id"
        _field_type: base

      - name: risk_rank
        type: string
        use_case: dimension
        expr: "@source: record.risk_rank"
        _field_type: base

      - name: risk_rank_value
        type: integer
        use_case: range
        expr: "@source: record.risk_rank_value"
        _field_type: base

      - name: solution
        type: string
        use_case: dimension
        expr: "@source: record.solution"
        _field_type: base

      - name: updated_at
        type: integer
        use_case: range
        expr: "@source: record.updated_at"
        comment: "Unix epoch seconds as exported"
        _field_type: base
