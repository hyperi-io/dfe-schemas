# Meta schema: runZero sites
#
# Sites: one row per site, with its asset, service, software and vulnerability counters and recalculation timestamps.
#
# Columns are the union of keys across the rows of a live export, typed from
# the values observed; the record sits under `record`, which is where every
# expression reads from. Generated by scripts/generate_meta_schemas.py: a
# changed export becomes a new version entry, never an edit of a published one.

current: "1.0.0"
resource_type: core

versions:
  "1.0.0":
    date: "2026-09-13"
    type: model
    summary: "Initial runZero sites schema, from a live export"
    columns:
      - name: id
        type: uuid
        use_case: exact_match
        expr: "@source: record.id"
        comment: "Row key of the export"
        _field_type: base

      - name: asset_address_count
        type: integer
        use_case: range
        expr: "@source: record.asset_address_count"
        comment: "0 on every row observed"
        _field_type: base

      - name: asset_address_extra_count
