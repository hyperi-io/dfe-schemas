[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dfe-schemas"
# Seed for the first hyperi-ci release only: with no v* tag in the repo,
# predict-version ships this value verbatim, then CI stamps every release after
# it. 0.2.0 because PyPI already holds 0.1.0 and refuses a re-upload.
version = "0.2.0"
description = "DFE table schemas and the ClickHouse DDL mechanics that render them"
# The PyPI page. README.md stays the GitHub front page.
readme = "docs/pypi.md"
license = "BUSL-1.1"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "HYPERI PTY LIMITED" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# ruamel.yaml, not PyYAML, and the same floor dfe-engine carries: YAML 1.1
# resolves `on`, `off`, `yes` and `no` as booleans and 1.2 does not, so two
# parsers over one schema tree is two answers.
dependencies = ["ruamel.yaml>=0.19.1"]

[project.urls]
Repository = "https://github.com/hyperi-io/dfe-schemas"

[tool.hatch.build.targets.sdist]
include = [
    "dfe_schemas",
    "manifest.yaml",
    "tables",
    "hunts",
    "common-header",
    "compat-profiles",
    "meta",
    "derived",
    "additional",
    "sources",
    "catalogue",
    "registries",
    "views",
    "roles",
    "topics",
    "tests",
    "README.md",
    "docs/pypi.md",
    "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["dfe_schemas"]
# The schema trees stay at the repo root so this checkout reads as itself; the
# wheel carries the same trees as package data, which is how consumers get them.
[tool.hatch.build.targets.wheel.force-include]
"manifest.yaml" = "dfe_schemas/data/manifest.yaml"
"tables" = "dfe_schemas/data/tables"
"hunts" = "dfe_schemas/data/hunts"
"common-header" = "dfe_schemas/data/common-header"
"compat-profiles" = "dfe_schemas/data/compat-profiles"
"meta" = "dfe_schemas/data/meta"
"derived" = "dfe_schemas/data/derived"
"additional" = "dfe_schemas/data/additional"
"sources" = "dfe_schemas/data/sources"
"catalogue" = "dfe_schemas/data/catalogue"
"registries" = "dfe_schemas/data/registries"
"views" = "dfe_schemas/data/views"
"roles" = "dfe_schemas/data/roles"
"topics" = "dfe_schemas/data/topics"

[tool.uv]
# Supply-chain cooldown (standards/universal/ci.md): never resolve a package
# version published in the last 7 days.
exclude-newer = "7 days"
# scalo is same-org, so it adopts a release on its first day.
exclude-newer-package = { scalo = false }

[dependency-groups]
# scalo[expression] is the rule engine the profiles compile under, jsonschema reads their schema.
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.2",
    "scalo[expression]>=2.31.20",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.coverage.report]
fail_under = 80

[tool.coverage.run]
source = ["dfe_schemas"]

[tool.ruff]
line-length = 100
target-version = "py314"
# Schema content, not code -- and the wheel build copies these trees verbatim.
# .worktrees holds other checkouts of this repo, not code in this one.
extend-exclude = [
    ".worktrees",
    "additional",
    "catalogue",
    "common-header",
    "compat-profiles",
    "derived",
    "hunts",
    "meta",
    "pipelines",
    "registries",
    "roles",
    "sources",
    "tables",
    "topics",
    "views",
]

[tool.ty.src]
# .worktrees holds other checkouts of this repo, not code in this one.
exclude = [".worktrees"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S", "I", "UP", "N", "PT", "RUF", "PIE"]
# vulture's own codes, so its `# noqa: V1xx` marks are not reported as invalid.
external = ["V"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
# Builds its SQL from the module's own constants, against the container it starts.
"tests/test_usage_rollup.py" = ["S101", "S608"]

[tool.ruff.lint.pydocstyle]
convention = "google"
