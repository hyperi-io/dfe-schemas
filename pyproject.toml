[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dfe-schemas"
# Seed for the first hyperi-ci release only: with no v* tag in the repo,
# predict-version ships this value verbatim, then CI stamps every release after
# it. 0.2.0 because PyPI already holds 0.1.0 and refuses a re-upload.
version = "0.2.0"
description = "DFE table schemas and the ClickHouse DDL mechanics that render them"
readme = "README.md"
license = "BUSL-1.1"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "HYPERI PTY LIMITED" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/hyperi-io/dfe-schemas"

[tool.hatch.build.targets.sdist]
include = [
    "dfe_schemas",
    "tables",
    "hunts",
    "common-header",
    "meta",
    "additional",
    "tests",
    "README.md",
    "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["dfe_schemas"]
# The schema trees stay at the repo root so this checkout reads as itself; the
# wheel carries the same trees as package data, which is how consumers get them.
[tool.hatch.build.targets.wheel.force-include]
"tables" = "dfe_schemas/data/tables"
"hunts" = "dfe_schemas/data/hunts"
"common-header" = "dfe_schemas/data/common-header"
"meta" = "dfe_schemas/data/meta"
"additional" = "dfe_schemas/data/additional"

[tool.uv]
# Supply-chain cooldown (standards/universal/ci.md): never resolve a package
# version published in the last 7 days.
exclude-newer = "7 days"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=7.1.0", "ruff>=0.16.2"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.coverage.report]
fail_under = 80

[tool.coverage.run]
source = ["dfe_schemas"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Schema content, not code -- and the wheel build copies these trees verbatim.
extend-exclude = [
    "additional",
    "common-header",
    "hunts",
    "meta",
    "pipelines",
    "tables",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S", "I", "UP", "N", "PT", "RUF", "PIE"]
ignore = [
    # This package renders ClickHouse DDL and probes system tables; every query
    # is built from schema definitions and database names, never user input.
    "S608",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"
