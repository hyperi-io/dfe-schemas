# Pretty names for the directories under catalogue/.
# The key is the directory. name is what the console shows.

aws:
  name: Amazon Web Services
  description: Logs and metrics from AWS services.
azure:
  name: Microsoft Azure
  description: Logs and metrics from Azure services, Entra ID, Defender for Cloud and Sentinel.
cisco:
  name: Cisco
  description: Logs and metrics from Cisco network and security products.
crowdstrike:
  name: CrowdStrike
  description: Alerts, host data and threat intelligence from CrowdStrike Falcon.
fortinet:
  name: Fortinet
  description: Logs from Fortinet firewalls, proxies, endpoints and email security.
gcp:
  name: Google Cloud
  description: Logs and metrics from Google Cloud services and Security Command Center.
google-workspace:
  name: Google Workspace
  description: Audit and activity logs from Google Workspace.
linux:
  name: Linux
  description: Audit, auth and system logs from Linux hosts.
microsoft-365:
  name: Microsoft 365
  description: Logs and usage metrics from Microsoft 365, Defender and Intune.
okta:
  name: Okta
  description: System logs and user entities from Okta.
palo-alto-networks:
  name: Palo Alto Networks
  description: Logs and metrics from Palo Alto Networks firewalls, Cortex XDR and Prisma.
tenable:
  name: Tenable
  description: Vulnerability, asset and scan data from Tenable.
uncategorised:
  name: Uncategorised
  description: Catalogue sources with no quick-add tag.
windows:
  name: Windows
  description: Event logs from Windows hosts, Active Directory, IIS, DHCP and DNS servers.
zscaler:
  name: Zscaler
  description: Logs from Zscaler Internet Access and Private Access.
