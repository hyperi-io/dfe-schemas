# DDL catalogue: the table defaults and the index each use case renders.
# docs/registries.md has the entry format, docs/meta-schema.md the indexes.

version: 1

# What a table gets when its definition does not say.
table:
  index_granularity: 2048
  partition_column: _timestamp_load
  partition_granularity: day
  # A low-volume audit table wants month, else it collects a part per day.
  partition_functions:
    day: toYYYYMMDD
    month: toYYYYMM

# ClickHouse rewrites a text index's GRANULARITY to 100000000, so a read-back
# that disagrees with the 1 below is the server, not drift.
use_cases:
  dimension:
    indexes:
      - {type: "set(0)", granularity: 4, when_nullable: {type: bloom_filter, granularity: 4}}

  exact_match:
    indexes:
      by_cardinality:
        low:
          - {type: "set(0)", granularity: 4, when_nullable: {type: bloom_filter, granularity: 4}}
        high:
          - {type: bloom_filter, granularity: 4}
        unknown:
          - {type: bloom_filter, granularity: 4}

  range:
    indexes:
      - {type: minmax, granularity: 4}

  word_search:
    indexes:
      - {type: "text(tokenizer=splitByNonAlpha)", granularity: 1}

  substring_search:
    indexes:
      - {type: "text(tokenizer=ngrams(3))", granularity: 1}

  key_search:
    indexes:
      - {suffix: key, expression: "mapKeys({col})", type: "text(tokenizer=array)", granularity: 1}
      - {suffix: value, expression: "mapValues({col})", type: "text(tokenizer=array)", granularity: 1}

  # One index per part: at GRANULARITY 1 the top-k comes back wrong.
  similarity_search:
    indexes:
      - {type: "vector_similarity('hnsw', 'cosineDistance', {dims})", granularity: 100000000}
