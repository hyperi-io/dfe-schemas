resource_type: core
standard: ocsf
version: "1.3.0"
description: Default OCSF (Open Cybersecurity Schema Framework) field mappings for DFE platform
# OCSF field -> ECS column, the pairing Elastic's amazon_security_lake pipeline applies.
# The RHS columns are the ECS/CIM maps' vocabulary, so one physical schema yields
# {source}_ecs, {source}_cim AND {source}_ocsf views. A minimal seed of the well-known
# network / actor / device / event fields - extend as needed.
mappings:
  src_endpoint.ip: source_ip
  dst_endpoint.ip: destination_ip
  src_endpoint.port: source_port
  dst_endpoint.port: destination_port
  actor.user.name: user_name
  device.hostname: host_hostname
  actor.process.name: process_name
  actor.process.cmd_line: process_command_line
  actor.process.pid: process_pid
  actor.process.parent_process.name: process_parent_name
  actor.process.parent_process.cmd_line: process_parent_command_line
  actor.process.parent_process.pid: process_parent_pid
  file.name: file_name
  file.path: file_path
  message: message
  time: _timestamp
