resource_type: core
standard: sigma
description: Sigma field to ECS column, from the pySigma Elasticsearch ECS pipelines
# Derived from pysigma-backend-elasticsearch 2.1.1 (the pysigma <2 line): ecs_windows,
# ecs_macos_esf, ecs_zeek_beats and ecs_kubernetes. A target is the ECS path with dots
# as underscores. A field whose ECS target changes with the rule's logsource
# (CommandLine, OriginalFileName, User, ...) has no default and needs a source map.
mappings:
  AccountDomain: user_domain
  AccountName: user_name
  Application: process_executable
  ClientAddress: source_ip
  ClientName: source_domain
  CurrentDirectory: process_working_directory
  DestAddress: destination_ip
  DestPort: destination_port
  Destination: process_executable
  DestinationHostname: destination_domain
  DestinationIp: destination_ip
  DestinationPort: destination_port
  DestinationPortName: network_protocol
  Device: file_path
  EffectiveUserId: process_user_id
  EventID: event_code
  FileDirectory: file_directory
  HostApplication: process_command_line
  HostId: process_entity_id
  HostName: process_title
  Image: process_executable
  ImageLoaded: file_path
  Imphash: file_pe_imphash
  Initiated: network_direction
  IpAddress: source_ip
  IpPort: source_port
  KextPath: file_path
  NewProcessId: process_pid
  NewProcessName: process_executable
  ParentCommandLine: process_parent_command_line
  ParentImage: process_parent_executable
  ParentProcessGuid: process_parent_entity_id
  ParentProcessId: process_parent_pid
  ParentProcessName: process_parent_name
  PipeName: file_name
