    view_reader_role: "dfe_query_reader_role"

  "1.0.0":
    date: "2026-09-16"
    type: model
    summary: "Moved out of dfe-engine's governance/ch/models.py; tiers, service roles, the tenant axis and the system-table grant lists unchanged"

    database_placeholder: "{db}"

    # Deterministic names, so a drop is computable from config alone.
    naming:
      role: "dfe_{name}_role"
      settings_profile: "dfe_{name}_profile"
      quota: "dfe_{name}_quota"
      service_user: "dfe_{name}"
      org_user: "dfe_org_{org}"
      group_user: "dfe_grp_{group}"
      row_policy: "dfe_rowpol_tenant_{database}_{table}"

    tenant:
      role: "dfe_tenant_role"
      # Pinned READONLY on each org user, so no query can override it.
      setting: "SQL_current_tenant_id"
      predicate: "has(splitByChar(',', getSetting('SQL_current_tenant_id')), _org_id)"
      # What HyperDX needs, and nothing that describes the deployment.
      system_tables:
        - columns
        - settings
        - table_engines
        - tables

    # Named one by one so a tenant never reaches them (docs/roles.md).
    system_introspection_tables:
      - asynchronous_metric_log
      - asynchronous_metrics
      - clusters
      - columns
      - dashboards
      - data_skipping_indices
      - databases
      - detached_parts
      - disks
      - error_log
      - errors
      - events
      - merges
      - metric_log
      - metrics
      - mutations
      - part_log
      - parts
      - processes
      - query_log
      - replicas
      - replication_queue
      - settings
      - table_engines
      - tables
      - text_log

    # Caps sized for an org sharing one user (docs/roles.md).
    tiers:
      - name: analyst_tier_1
        kind: analyst
        default: false
        grants: ["SELECT ON {db}.*"]
        settings:
          # readonly=2: clients send output settings with every query.
          readonly: 2
          max_memory_usage: 17179869184
          max_execution_time: 600
          max_rows_to_read: 0
        quota:
          interval: "1 hour"
          queries: 50000
          # A tight errors cap locks the whole org out for the interval.
          errors: 1000
          result_rows: 1000000000

      - name: analyst_tier_2
        kind: analyst
        default: true
        grants: ["SELECT ON {db}.*"]
        settings:
          readonly: 2
          max_memory_usage: 4294967296
          max_execution_time: 300
          max_rows_to_read: 0
        quota:
          interval: "1 hour"
          queries: 20000
          errors: 1000
          result_rows: 1000000000

      - name: analyst_tier_3
        kind: analyst
        default: false
        grants: ["SELECT ON {db}.*"]
        settings:
          readonly: 2
          max_memory_usage: 1073741824
          max_execution_time: 2
          max_rows_to_read: 0
        quota:
          interval: "1 hour"
          queries: 2000
          errors: 1000
          result_rows: 1000000000

      # Hunts read the data and write detections, so no readonly.
      - name: hunt_tier_1
        kind: hunt
        default: false
        grants: ["SELECT ON {db}.*", "INSERT ON {db}.*"]
        settings:
          max_memory_usage: 17179869184
          max_execution_time: 600
        quota:
          interval: "1 hour"
          queries: 10000
          result_rows: 10000000000
          errors: 500

      - name: hunt_tier_2
        kind: hunt
        default: true
        grants: ["SELECT ON {db}.*", "INSERT ON {db}.*"]
        settings:
          max_memory_usage: 4294967296
          max_execution_time: 120
        quota:
          interval: "1 hour"
          queries: 5000
          result_rows: 10000000000
          errors: 500

      - name: hunt_tier_3
        kind: hunt
        default: false
        grants: ["SELECT ON {db}.*", "INSERT ON {db}.*"]
        settings:
          max_memory_usage: 1073741824
          max_execution_time: 15
        quota:
          interval: "1 hour"
          queries: 1000
          result_rows: 10000000000
          errors: 500

    # Fixed identities, not tiered (docs/roles.md).
    service_roles:
      - name: loader
        mint_user: true
        grants: ["INSERT ON {db}.*"]
        settings:
          async_insert: 1
          wait_for_async_insert: 1
          wait_for_async_insert_timeout: 120
          async_insert_busy_timeout_max_ms: 1000
          async_insert_max_data_size: 134217728

      # HyperDX's platform connection and the KEDA shim.
      - name: query_reader
        mint_user: true
        grants: ["SELECT ON {db}.*"]
        system_introspection: true
        settings:
          # readonly=2: clients send output settings with every query.
          readonly: 2
          allow_ddl: 0
          max_execution_time: 30
          max_rows_to_read: 10000000
          max_memory_usage: 2147483648

      # Granted alongside a hunt tier at bind time, not a minted user.
      - name: hunt_runner
        mint_user: false
        grants:
          - "SELECT ON {db}.*"
          - "INSERT ON {db}.*"
          # The safe horizon: how far behind each replica of a hunted table is.
          - "SELECT ON system.replicas"

      # Bound to admin and infra-admin group users, never an analyst tier.
      - name: otel_reader
        mint_user: false
        grants: ["SELECT ON {db}.*"]

    # Each view grants SELECT to this role on apply.
    view_reader_role: "dfe_query_reader_role"
