# default -- the landing table every source writes into
#
# Columns come from the deployment's common-header profile; this file carries
# only the DDL config. TTL names the partition column because
# ttl_only_drop_parts drops a part only once every row in it has expired. The
# retention period is the deployment default; no ttl_days here on purpose.

current: "1.0.0"

versions:
  "1.0.0":
    date: "2026-08-27"
    type: model
    summary: "Deployment-default retention aligned to the load-time partition"
    table:
      name: "default"
      partition_column: "_timestamp_load"
      partition_granularity: "day"
      ttl_columns: ["_timestamp_load"]
