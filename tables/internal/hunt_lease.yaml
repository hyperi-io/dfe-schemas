# hunt_lease -- who owns each hunt, and until when
#
# Engine working state rather than user data, so the columns are exact
# ClickHouse types with no meta-schema mapping behind them.
#
# The engine is an INTENT resolved per topology, never a literal: a literal is
# correct on a single node and lands on one replica of a cluster, where a
# restart that reconnects elsewhere finds no table.

current: "1.0.0"

versions:
  "1.0.0":
    date: "2026-08-26"
    type: model
    summary: "One lease row per hunt, newest write winning after merge"
    table:
      name: "hunt_lease"
      engine: "ReplacingMergeTree(claimed)"
      index_granularity: 2048
    columns:
      - name: "hunt_id"
        ch_type: "String"
        order: 0
      - name: "owner"
        ch_type: "String"
        comment: "worker id holding the lease"
      - name: "fire"
        ch_type: "Int64"
        comment: "the scheduled fire time this lease covers"
      - name: "lease_until"
        ch_type: "Int64"
        comment: "epoch seconds the claim expires"
      - name: "claimed"
        ch_type: "DateTime64(3)"
        default: "now64(3)"
