# otel_traces -- the OTel spans
#
# Seeded from the HyperDX collector preset the DFE stack deploys, then held
# here so it can be optimised like any other DFE table. The exporter runs with
# `create_schema: false` and only ever INSERTs.
#
# Three deltas from the upstream shape, all about retention: `_timestamp_load`
# joins the common header on every otel table, PARTITION BY is load time rather
# than event time so a closed partition stays closed, and TTL rides that same
# column so an expiring partition drops as whole parts. ORDER BY is deliberately
# untouched -- these are queried on event time and service.

current: "1.0.0"

versions:
  "1.0.0":
    date: "2026-08-26"
    type: model
    summary: "Every OTel span, with its events and links as parallel arrays"
    table:
      name: "otel_traces"
      engine: "MergeTree"
      partition_by: "toDate(_timestamp_load)"
      ttl_days: 30
      ttl_columns: ["_timestamp_load"]
      order_by: "ServiceName, SpanName, toDateTime(Timestamp)"
      index_granularity: 8192
      indexes:
        - "INDEX idx_trace_id TraceId TYPE bloom_filter(0.001) GRANULARITY 1"
        - "INDEX idx_res_attr_key mapKeys(ResourceAttributes) TYPE bloom_filter(0.01) GRANULARITY 1"
        - "INDEX idx_res_attr_value mapValues(ResourceAttributes) TYPE bloom_filter(0.01) GRANULARITY 1"
        - "INDEX idx_span_attr_key mapKeys(SpanAttributes) TYPE bloom_filter(0.01) GRANULARITY 1"
        - "INDEX idx_span_attr_value mapValues(SpanAttributes) TYPE bloom_filter(0.01) GRANULARITY 1"
        - "INDEX idx_duration Duration TYPE minmax GRANULARITY 1"
        # Timestamp sits third in the sort key behind two high-cardinality
        # strings, and the partition is load time, so a bare time-range query
        # has no other way to prune.
        - "INDEX idx_timestamp Timestamp TYPE minmax GRANULARITY 1"
    columns:
      - name: "Timestamp"
        ch_type: "DateTime64(9)"
        codec: "Delta(8), ZSTD(1)"
      - name: "TraceId"
        ch_type: "String"
        codec: "ZSTD(1)"
      - name: "SpanId"
        ch_type: "String"
        codec: "ZSTD(1)"
      - name: "ParentSpanId"
        ch_type: "String"
        codec: "ZSTD(1)"
      - name: "TraceState"
        ch_type: "String"
        codec: "ZSTD(1)"
      - name: "SpanName"
        ch_type: "String"
        lowcardinality: true
        codec: "ZSTD(1)"
      - name: "SpanKind"
        ch_type: "String"
        lowcardinality: true
        codec: "ZSTD(1)"
      - name: "ServiceName"
        ch_type: "String"
        lowcardinality: true
        codec: "ZSTD(1)"
      - name: "ResourceAttributes"
        ch_type: "Map(LowCardinality(String), String)"
        codec: "ZSTD(1)"
      - name: "ScopeName"
        ch_type: "String"
        codec: "ZSTD(1)"
      - name: "ScopeVersion"
        ch_type: "String"
        codec: "ZSTD(1)"
      - name: "SpanAttributes"
        ch_type: "Map(LowCardinality(String), String)"
        codec: "ZSTD(1)"
      - name: "Duration"
        ch_type: "UInt64"
        codec: "ZSTD(1)"
      - name: "StatusCode"
        ch_type: "String"
        lowcardinality: true
        codec: "ZSTD(1)"
      - name: "StatusMessage"
        ch_type: "String"
        codec: "ZSTD(1)"
      - name: "Events.Timestamp"
        ch_type: "Array(DateTime64(9))"
        codec: "ZSTD(1)"
      - name: "Events.Name"
        ch_type: "Array(LowCardinality(String))"
        codec: "ZSTD(1)"
      - name: "Events.Attributes"
        ch_type: "Array(Map(LowCardinality(String), String))"
        codec: "ZSTD(1)"
      - name: "Links.TraceId"
        ch_type: "Array(String)"
        codec: "ZSTD(1)"
      - name: "Links.SpanId"
        ch_type: "Array(String)"
        codec: "ZSTD(1)"
      - name: "Links.TraceState"
        ch_type: "Array(String)"
        codec: "ZSTD(1)"
      - name: "Links.Attributes"
        ch_type: "Array(Map(LowCardinality(String), String))"
        codec: "ZSTD(1)"
      - name: "_timestamp_load"
        ch_type: "DateTime64(3,'UTC')"
        default: "now64(3)"
        codec: "Delta, LZ4"
        comment: "Insertion timestamp (ms precision)"
