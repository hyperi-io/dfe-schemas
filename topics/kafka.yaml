      # The topic a source's transform writes, and the loader then reads.
      load_suffix: "_load"
      # The _source label of the platform's landing table.
      default_landing_label: "main"

    defaults:
      # Must match the broker's message.max.bytes and replica.fetch.max.bytes.
      max_message_bytes: 16777216
      landing:
        partitions: 12
        replication_factor: 3
        # How long a consumer may be down before events are lost.
        retention_hours: 24
      dlq:
        # Read by a person, not a consumer group.
        partitions: 1
        replication_factor: 3
        # A dead-lettered record exists nowhere else once its offset is committed.
        retention_hours: 168

    bootstrap:
      # dfe-loader treats finding no *_land topic as fatal.
      landing:
        - name: main_land
          kind: landing
      # One per fleet app, one shared by the transform family.
      dlq:
        - name: dfe_receiver_dlq
          kind: dlq
          app: dfe-receiver
        - name: dfe_loader_dlq
          kind: dlq
          app: dfe-loader
        - name: dfe_archiver_dlq
          kind: dlq
          app: dfe-archiver
        - name: dfe_fetcher_dlq
          kind: dlq
          app: dfe-fetcher
        - name: dfe_transform_dlq
          kind: dlq
          app: dfe-transform

    derivation:
      per_source: true
      # An idle transform's _load topic would stop the loader reading _land.
      exclude_idle_transform_sinks: true
      skip_duplicate_default: true

    # No delete: a compromised engine principal must not drop the bus.
    permissions:
      create: true
      alter: true
      delete: false
