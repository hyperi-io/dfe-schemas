# The Kafka bootstrap topic set, the naming rule and the derivation rule.
# docs/topics.md explains each block.

current: "1.1.0"
resource_type: core

versions:
  "1.1.0":
    date: "2026-09-17"
    type: revision
    summary: "The landing topic carries remote.storage.enable where the deployment tiers -- the per-topic half of tiered storage, lost with the dfe-infra chart helper"

    naming:
      # The topic a source's records arrive on, before any transform.
      land_suffix: "_land"
      # The topic a source's transform writes, and the loader then reads.
      load_suffix: "_load"
      # The _source label of the platform's landing table.
      default_landing_label: "main"

    defaults:
      # Must match the broker's message.max.bytes and replica.fetch.max.bytes.
      max_message_bytes: 16777216
      landing:
        partitions: 12
        replication_factor: 3
        # How long a consumer may be down before events are lost.
        retention_hours: 24
      dlq:
        # Read by a person, not a consumer group.
        partitions: 1
        replication_factor: 3
        # A dead-lettered record exists nowhere else once its offset is committed.
        retention_hours: 168

    # Rendered where kafka_tiered_storage is on, absent otherwise (docs/topics.md).
    tiered:
      # A DLQ is small and read by a person, so it stays local.
      sections:
        - landing
      config:
        remote.storage.enable: "true"

    bootstrap:
      # dfe-loader treats finding no *_land topic as fatal.
      landing:
        - name: main_land
          kind: landing
      # One per fleet app, one shared by the transform family.
      dlq:
        - name: dfe_receiver_dlq
          kind: dlq
          app: dfe-receiver
        - name: dfe_loader_dlq
          kind: dlq
          app: dfe-loader
        - name: dfe_archiver_dlq
          kind: dlq
          app: dfe-archiver
        - name: dfe_fetcher_dlq
          kind: dlq
          app: dfe-fetcher
        - name: dfe_transform_dlq
          kind: dlq
          app: dfe-transform

    derivation:
      per_source: true
      # An idle transform's _load topic would stop the loader reading _land.
      exclude_idle_transform_sinks: true
      skip_duplicate_default: true

    # No delete: a compromised engine principal must not drop the bus.
    permissions:
      create: true
      alter: true
      delete: false

  "1.0.0":
    date: "2026-09-16"
    type: model
    summary: "The landing topic, the five DLQ topics, the naming rule and the compose derivation, moved out of the dfe-infra chart and dfe-docker's resolver"

